# GitHub Actions CI pipeline for Rust-focused jobs.
#
# Gated on paths that affect Rust compilation, linting, formatting,
# dependency auditing, or database-backed integration tests. Commits
# that touch only documentation, licence files, shell scripts,
# container definitions, or CI infrastructure that does not affect
# the Rust build are skipped.
#
# All jobs run on GitHub-hosted runners (`ubuntu-latest`). The
# `integration` job additionally uses PostgreSQL and Redis service
# containers.
#
# Related workflows:
#   ci-reuse.yml            REUSE licence compliance (unconditional).
#   ci-e2e.yml              Playwright end-to-end and federation interop tests.
#   verify.yml              Server and chatmail container image builds.

name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "crates/**"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "rustfmt.toml"
      - "scripts/check-inline-scripts.sh"
      - "scripts/check-migrations.sh"
      - "scripts/check-typst-injection.sh"
      - "templates/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "crates/**"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "rustfmt.toml"
      - "scripts/check-inline-scripts.sh"
      - "scripts/check-migrations.sh"
      - "scripts/check-typst-injection.sh"
      - "templates/**"
  workflow_dispatch:
    inputs:
      release:
        description: "Build a release binary"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  safe-rust:
    name: Safe Rust only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify all first-party crates forbid unsafe code
        run: |
          FAIL=0
          for crate_dir in crates/*/; do
            crate_name=$(basename "$crate_dir")
            entry=""
            if [ -f "$crate_dir/src/lib.rs" ]; then
              entry="$crate_dir/src/lib.rs"
            elif [ -f "$crate_dir/src/main.rs" ]; then
              entry="$crate_dir/src/main.rs"
            else
              echo "  ?  $crate_name: no lib.rs or main.rs found"
              continue
            fi

            if grep -q 'forbid(unsafe_code)' "$entry"; then
              echo "  ✓  $crate_name"
            else
              echo "  ✗  $crate_name: missing #![forbid(unsafe_code)] in $entry"
              FAIL=$((FAIL + 1))
            fi
          done

          if [ "$FAIL" -gt 0 ]; then
            echo ""
            echo "::error::$FAIL crate(s) missing #![forbid(unsafe_code)]"
            exit 1
          fi

  csp-templates:
    name: Template CSP compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: "Reject inline script, inline style, and javascript: URLs"
        run: scripts/check-inline-scripts.sh

  migration-shape:
    name: Migration shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: "Reject duplicate versions and irreversible migrations"
        run: scripts/check-migrations.sh

  typst-injection:
    name: Typst injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache Cargo artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-typst-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-typst-
      # Compiles the emitter's corpus with the real Typst binary. The
      # unit tests assert that no user text leaves a string literal in
      # the generated source; only the compiler can say what Typst then
      # does with it.
      - name: "Assert hostile CV markup compiles to inert text"
        run: scripts/check-typst-injection.sh

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache Cargo artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deny-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deny-
      - name: Install cargo-deny
        run: command -v cargo-deny >/dev/null || cargo install cargo-deny --locked
      - run: cargo deny check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache Cargo artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-clippy-
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache Cargo artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-
      # No database here, so the `#[ignore]`d `#[sqlx::test]` tests are
      # skipped. The `integration` job below runs them.
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.94.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install MSRV toolchain
        run: |
          rustup install 1.94.0
          rustup default 1.94.0
      - name: Cache Cargo artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.rustup/toolchains
            target
          key: cargo-msrv-1.94.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-msrv-1.94.0-
      - run: cargo check --workspace

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noombat
          POSTGRES_PASSWORD: noombat
          POSTGRES_DB: noombat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noombat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOOMBAT_DATABASE_URL: postgres://noombat:noombat@localhost/noombat
      DATABASE_URL: postgres://noombat:noombat@localhost/noombat
      NOOMBAT_DOMAIN: localhost
      NOOMBAT_PORT: "8443"
      NOOMBAT_ADMIN_TOKEN: ci-test-token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache Cargo artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-integration-
      - name: Install sqlx-cli
        run: |
          command -v sqlx >/dev/null || cargo install sqlx-cli@0.9.0 \
            --locked --no-default-features --features postgres,rustls
      - name: Run migrations
        run: sqlx migrate run --source migrations
      # `--include-ignored` picks up the `#[sqlx::test]` tests that the
      # DB-less `test` job skips. Without it they would never run
      # anywhere, and would rot unnoticed.
      - run: cargo test --workspace -- --include-ignored

  # ..... ON-DEMAND RELEASE BUILD .....

  release-build:
    name: Release build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Cargo artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-

      - name: Build release binary
        run: cargo build --release --bin noombat

      - name: Build frontend assets
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload release binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noombat-release
          path: target/release/noombat
          retention-days: 30

      - name: Upload frontend assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noombat-frontend
          path: frontend/dist/
          retention-days: 30
