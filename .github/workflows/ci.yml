# GitHub Actions CI pipeline.
#
# Jobs `fmt`, `reuse`, and `safe-rust` run on GitHub's hosted runners
# (`ubuntu-latest`). They require no infrastructure and perform no
# Rust compilation.
#
# All other jobs run on a self-hosted runner registered with the label
# `self-hosted`, inside the `ghcr.io/noombat/noombat-ci` container image,
# which pre-installs Rust, Node.js, pnpm, sqlx-cli, cargo-deny, wasm-pack,
# and system build dependencies. Jobs `integration`, `e2e`, and `interop` 
# additionally use PostgreSQL and Redis service containers.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Build a release binary"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# ..... HOSTED RUNNER JOBS (no Rust compilation required) .....

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable \
              --profile minimal --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install reuse
        run: pip install --break-system-packages reuse==6.2.0
      - run: reuse lint

  safe-rust:
    name: Safe Rust only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all first-party crates forbid unsafe code
        run: |
          FAIL=0
          for crate_dir in crates/*/; do
            crate_name=$(basename "$crate_dir")
            # Check lib.rs or main.rs (whichever exists).
            entry=""
            if [ -f "$crate_dir/src/lib.rs" ]; then
              entry="$crate_dir/src/lib.rs"
            elif [ -f "$crate_dir/src/main.rs" ]; then
              entry="$crate_dir/src/main.rs"
            else
              echo "  ?  $crate_name: no lib.rs or main.rs found"
              continue
            fi

            if grep -q 'forbid(unsafe_code)' "$entry"; then
              echo "  ✓  $crate_name"
            else
              echo "  ✗  $crate_name: missing #![forbid(unsafe_code)] in $entry"
              FAIL=$((FAIL + 1))
            fi
          done

          if [ "$FAIL" -gt 0 ]; then
            echo ""
            echo "::error::$FAIL crate(s) missing #![forbid(unsafe_code)]"
            exit 1
          fi

  # ..... SELF-HOSTED RUNNER JOBS (Rust compilation required) .....

  deny:
    name: Cargo Deny
    runs-on: self-hosted
    container:
      image: ghcr.io/noombat/noombat-ci:latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-deny-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deny-
      - run: cargo deny check

  clippy:
    name: Clippy
    runs-on: self-hosted
    container:
      image: ghcr.io/noombat/noombat-ci:latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-clippy-
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Unit tests
    # Runs without a database. Tests that require PostgreSQL are
    # exercised in the `integration` job instead.
    runs-on: self-hosted
    container:
      image: ghcr.io/noombat/noombat-ci:latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.94.0)
    runs-on: self-hosted
    container:
      image: ghcr.io/noombat/noombat-ci:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        run: |
          rustup install 1.94.0
          rustup default 1.94.0
      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            /usr/local/rustup/toolchains
            target
          key: cargo-msrv-1.94.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-msrv-1.94.0-
      - run: cargo check --workspace

  integration:
    name: Integration tests
    runs-on: self-hosted
    container:
      image: ghcr.io/noombat/noombat-ci:latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noombat
          POSTGRES_PASSWORD: noombat
          POSTGRES_DB: noombat
        options: >-
          --health-cmd "pg_isready -U noombat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOOMBAT_DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      NOOMBAT_DOMAIN: localhost
      NOOMBAT_PORT: "8443"
      NOOMBAT_ADMIN_TOKEN: ci-test-token
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-integration-
      - name: Run migrations
        run: sqlx migrate run --source migrations
      - run: cargo test --workspace

  e2e:
    name: End-to-end tests (Firefox, Chromium, WebKit)
    runs-on: self-hosted
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: "--shm-size=2g --ipc=host"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noombat
          POSTGRES_PASSWORD: noombat
          POSTGRES_DB: noombat
        options: >-
          --health-cmd "pg_isready -U noombat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOME: /root
      NOOMBAT_DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      NOOMBAT_DOMAIN: localhost
      NOOMBAT_PORT: "8443"
      NOOMBAT_ADMIN_TOKEN: ci-test-token
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential pkg-config postgresql-client

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-e2e-

      - name: Install sqlx-cli and run migrations
        run: |
          cargo install sqlx-cli@0.9.0 --locked --no-default-features \
            --features postgres,rustls
          sqlx migrate run --source migrations

      - name: Build Noombat server
        run: cargo build --release --bin noombat

      - name: Build frontend assets
        working-directory: frontend
        run: |
          corepack enable
          pnpm install
          pnpm build

      - name: Seed test actor
        run: |
          PGPASSWORD=noombat psql -h postgres -U noombat -d noombat -c "
            INSERT INTO actors
              (actor_type, ap_id, username, domain, public_key_pem, is_local)
            VALUES
              ('individual', 'http://localhost:8443/users/testuser',
               'testuser', 'localhost',
               '-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0placeholder
          -----END PUBLIC KEY-----',
               TRUE)
            ON CONFLICT (ap_id) DO NOTHING;"

      - name: Start Noombat server
        run: |
          nohup ./target/release/noombat > /tmp/noombat.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8443/healthz; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Server failed to start within 60 seconds"
          cat /tmp/noombat.log
          exit 1

      - name: Install Playwright test dependencies
        working-directory: tests/e2e
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run Playwright tests (Firefox)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=firefox

      - name: Run Playwright tests (Chromium)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=chromium

      - name: Run Playwright tests (WebKit)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=webkit

      - name: Run Playwright tests (Firefox mobile viewport)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=firefox-mobile

      - name: Run Playwright tests (Chromium mobile viewport)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=chromium-mobile

      - name: Run Playwright tests (WebKit mobile viewport)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=webkit-mobile

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/noombat.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

  interop:
    name: Federation interop (GotoSocial)
    runs-on: self-hosted
    container:
      image: ghcr.io/noombat/noombat-ci:latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noombat
          POSTGRES_PASSWORD: noombat
          POSTGRES_DB: noombat
        options: >-
          --health-cmd "pg_isready -U noombat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      gotosocial:
        image: superseriousbusiness/gotosocial:latest
        env:
          GTS_HOST: gotosocial
          GTS_ACCOUNT_DOMAIN: gotosocial
          GTS_PROTOCOL: http
          GTS_PORT: "8080"
          GTS_TLS_MODE: ""
          GTS_DB_TYPE: sqlite
          GTS_DB_ADDRESS: /gotosocial/storage/sqlite.db
          GTS_STORAGE_LOCAL_BASE_PATH: /gotosocial/storage
          GTS_ACCOUNTS_REGISTRATION_OPEN: "false"
          GTS_LETSENCRYPT_ENABLED: "false"
        options: >-
          --health-cmd "wget -qO- http://localhost:8080/readyz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 15s
    env:
      NOOMBAT_DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      NOOMBAT_DOMAIN: localhost
      NOOMBAT_PORT: "8443"
      NOOMBAT_ADMIN_TOKEN: interop-test-token
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-interop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-interop-

      - name: Run migrations
        run: sqlx migrate run --source migrations

      - name: Build Noombat server
        run: cargo build --release --bin noombat

      - name: Build frontend assets
        working-directory: frontend
        run: |
          corepack enable
          pnpm install
          pnpm build

      - name: Seed test actor
        run: |
          PGPASSWORD=noombat psql -h postgres -U noombat -d noombat -c "
            INSERT INTO actors
              (actor_type, ap_id, username, domain, public_key_pem, is_local)
            VALUES
              ('individual', 'http://localhost:8443/users/alice',
               'alice', 'localhost',
               '-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAngu+UeqfsU3AJHhVHk2k
          MEjaIOzbOWRPu1TsqUpGq0IX/mhQUC6/mkF9+H27ziERaM+77JB7MQ9q1ITLnukj
          TlmQhgUrsstMV1ZiU+9WqJ+NmlpdoQ4zVFXEf7IJHmZ+mYxei/qhVrnBDvV4e1KR
          iOTxUYyqWrI7BFGrA3eR22zb9K5/CwOuTw0uYGGhkxfMalBXd4k1AyYGsHo/riQY
          xOCucw31jlUavoajo3CPXWXgCi+F6mumsIm7snaFNiCG8d8jqXZ8aSC8JcGImf95
          Gg3J3oGE9ZiAue0WmYC+oMDzLBJtqN0V/c1OsU7PsP8+8fllvlfBluhuTfR/O19J
          RQIDAQAB
          -----END PUBLIC KEY-----',
               TRUE)
            ON CONFLICT (ap_id) DO NOTHING;"

      - name: Start Noombat server
        run: |
          nohup ./target/release/noombat > /tmp/noombat.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8443/healthz; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Server failed to start within 60 seconds"
          cat /tmp/noombat.log
          exit 1

      - name: Run interop tests
        run: tests/interop/run.sh http://localhost:8443 http://gotosocial:8080

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/noombat.log

  # ..... ON-DEMAND RELEASE BUILD .....

  release-build:
    name: Release build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
    runs-on: self-hosted
    container:
      image: ghcr.io/noombat/noombat-ci:latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-

      - name: Build release binary
        run: cargo build --release --bin noombat

      - name: Build frontend assets
        working-directory: frontend
        run: |
          corepack enable
          pnpm install
          pnpm build

      - name: Build WASM chat module
        working-directory: frontend
        run: pnpm build:wasm

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: noombat-release
          path: target/release/noombat
          retention-days: 30

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: noombat-frontend
          path: frontend/dist/
          retention-days: 30
