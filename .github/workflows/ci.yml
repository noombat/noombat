# GitHub Actions CI pipeline for Rust-focused jobs.
#
# Gated on paths that affect Rust compilation, linting, formatting,
# dependency auditing, or database-backed integration tests. Commits
# that touch only documentation, licence files, or shell scripts no job
# here reads are skipped. Every workflow change runs it, because the
# `actions-policy` job checks every workflow's `uses:`.
#
# The compose files are in the list even though they compile nothing.
# Two jobs here read them: `dependency-hygiene` runs
# check-image-pins.sh, which exists to catch a workflow and a compose
# file drifting to different digests, and `integration` starts its
# Postgres, Redis and Meilisearch from them. Leaving them out meant a
# compose-only change ran neither, so the one gate written for that
# drift never fired on the commits that cause it, and the pull request
# went green having exercised nothing.
#
# All jobs run on GitHub-hosted runners (`ubuntu-latest`). The
# `integration` job additionally uses PostgreSQL, Redis and Meilisearch
# service containers.
#
# Related workflows:
#   ci-reuse.yml            REUSE licence compliance (unconditional).
#   ci-e2e.yml              Playwright end-to-end and federation interop tests.
#   verify.yml              Server and chatmail container image builds.
#   typst.yml               The CV renderer against the image's Typst binary.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "rustfmt.toml"
      - "scripts/check-action-allowlist.sh"
      - "scripts/check-action-tags.sh"
      - "scripts/check-image-pins.sh"
      - "scripts/check-compose-config.sh"
      - "compose*.yml"
      - "tests/*/compose*.yml"
      - "scripts/check-inline-scripts.sh"
      - "scripts/check-migrations.sh"
      - "scripts/check-safe-rust.sh"
      - "scripts/check-config-secrets.py"
      - "scripts/check-template-comments.sh"
      - "scripts/check-unused-deps.sh"
      - "frontend/vite.config.ts"
      - "tests/interop/fixture-credential.sh"
      - "tests/chat-interop/fixture-credential.sh"
      - "scripts/e2e-stack.sh"
      - "templates/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "rustfmt.toml"
      - "scripts/check-action-allowlist.sh"
      - "scripts/check-action-tags.sh"
      - "scripts/check-image-pins.sh"
      - "scripts/check-compose-config.sh"
      - "compose*.yml"
      - "tests/*/compose*.yml"
      - "scripts/check-inline-scripts.sh"
      - "scripts/check-migrations.sh"
      - "scripts/check-safe-rust.sh"
      - "scripts/check-config-secrets.py"
      - "scripts/check-template-comments.sh"
      - "scripts/check-unused-deps.sh"
      - "frontend/vite.config.ts"
      - "tests/interop/fixture-credential.sh"
      - "tests/chat-interop/fixture-credential.sh"
      - "scripts/e2e-stack.sh"
      - "templates/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      release:
        description: "Build a release binary"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # A smaller target/: no incremental state, and line tables rather
  # than full debug information, which keeps file and line in a test's
  # backtrace.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Caches that hold target/ are skipped on pull requests, which build
# cold: a pull request's entry counts against the repository's cache
# budget although main cannot restore it. Elsewhere they are restored
# by their exact key only, because restoring an older target/ and saving
# it again grows the entry on every lockfile change.

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  safe-rust:
    name: Safe Rust only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every crate root, not one per crate directory. The attribute is
      # per root, so a crate with two `[[bin]]` targets has two.
      - name: Verify every crate root forbids unsafe code
        run: scripts/check-safe-rust.sh

  markup-conventions:
    name: Markup conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Reject inline script, inline style, and javascript: URLs"
        run: scripts/check-inline-scripts.sh
      # Askama passes HTML through untouched, so an unterminated <!--
      # builds clean and swallows whatever follows it in the rendered
      # page, including markup inherited from the layout.
      - name: "Reject unbalanced HTML comment delimiters"
        if: ${{ !cancelled() }}
        run: scripts/check-template-comments.sh

  dependency-hygiene:
    name: Dependency hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A workflow `services:` or `container:` image is the one image
      # reference no updater reaches, so this is the only thing that
      # notices when it drifts from the compose file naming the same
      # image. Deterministic, and blocking for that reason.
      - name: "Assert workflow images are pinned and agree with compose"
        run: scripts/check-image-pins.sh
      # Nothing else loads compose.prod.yml before a deployment does.
      - name: "Assert every compose combination loads"
        if: ${{ !cancelled() }}
        run: scripts/check-compose-config.sh
      # Advisory: the scan reports candidates, not conclusions, because a
      # dependency can be load-bearing without being named anywhere, by
      # enabling a feature or registering a runtime provider. Failing on a
      # heuristic would eventually block an urgent bump. Drop
      # `continue-on-error` to make it a gate.
      - name: "Report dependencies nothing imports"
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: scripts/check-unused-deps.sh

  actions-policy:
    name: Actions policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A `uses:` the policy refuses does not fail a job, it makes the
      # whole workflow startup_failure: no jobs, so no check runs, so the
      # commit reads green while nothing ran. This is the only thing that
      # reports it before a push.
      - name: "Reject actions the repository policy will not run"
        run: scripts/check-action-allowlist.sh
      # A reader trusts a pin's release comment, and a hand edit can leave
      # a SHA that is not the release named.
      - name: "Reject a pinned SHA that is not the release its comment names"
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-action-tags.sh

  migration-shape:
    name: Migration shape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Reject duplicate versions and irreversible migrations"
        run: scripts/check-migrations.sh

  config-secrets:
    name: Config secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `Secret` is what redacts a credential from Debug output and what
      # makes NOOMBAT_<NAME>_FILE work. A field added as a bare String
      # gets neither, and nothing else fails: the instance boots and the
      # setting works. Only a name check catches it.
      - name: "Reject a credential-bearing Config field that is not Secret"
        run: python3 scripts/check-config-secrets.py

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The one place the cargo-deny release is named: advisories.yml,
      # scripts/test.sh and the weekly freshness check read it from here.
      CARGO_DENY_VERSION: "0.22.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Cargo artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deny-${{ env.CARGO_DENY_VERSION }}-
      # Pinned, and asserted rather than assumed. cargo-deny releases
      # change what deny.toml may contain: 0.18.6 rejects its `unsound`
      # key outright while 0.22.0 accepts it, so an unpinned install is a
      # job that can fail on configuration rather than on a finding.
      # Testing the version rather than the binary's presence matters
      # because the cache restores whatever it last held.
      - name: Install cargo-deny
        run: |
          cargo deny --version 2>/dev/null | grep -qx "cargo-deny $CARGO_DENY_VERSION" \
            || cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION" --force
      - run: cargo deny check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Cargo artefacts
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-clippy-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      # `--all-targets` so test and bench code is linted too. Without it
      # everything under `#[cfg(test)]` is never compiled by this job,
      # which is how a `nonminimal_bool` in middleware.rs stayed green
      # from July onwards.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Cargo artefacts
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      # No database here, so the `#[ignore]`d `#[sqlx::test]` tests are
      # skipped. The `integration` job below runs them.
      - run: cargo test --workspace --no-fail-fast

  msrv:
    name: MSRV (from Cargo.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Read, not repeated. The floor was written here as well as in
      # Cargo.toml, so raising `rust-version` would leave this job proving
      # the old one while its name advertised the new one.
      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version *= *"\([0-9][0-9.]*\)".*/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no rust-version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $version"
      - name: Install MSRV toolchain
        run: rustup install "${{ steps.msrv.outputs.version }}" --profile minimal
      - name: Cache Cargo artefacts
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.rustup/toolchains
            target
          key: cargo-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
      # RUSTUP_TOOLCHAIN rather than `rustup default`: rust-toolchain.toml
      # outranks the default, so the job that set the default compiled on
      # whatever that file names and never once exercised the floor.
      #
      # The version is then read back, because that failure is silent: a
      # job checking the wrong toolchain passes for the same reason the
      # right one would, and reports the floor as held either way.
      - name: Check the workspace against the floor
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          declared="${{ steps.msrv.outputs.version }}"
          actual=$(rustc --version | cut -d' ' -f2)
          if [ "$actual" != "$declared" ]; then
            echo "::error::expected rustc $declared, got $actual; the floor was not exercised" >&2
            exit 1
          fi
          cargo check --workspace

  # The services come from the compose files rather than a `services:`
  # block, and that is deliberate.
  #
  # A `services:` block is the one place an image reference can sit
  # where no updater will propose it: Dependabot's docker ecosystem
  # reads Dockerfiles, docker-compose reads compose files, and
  # github-actions reads `uses:`. A copy here drifts from compose
  # silently, leaving CI asserting against one version while every
  # deployment runs another.
  #
  # compose.dev.yml publishes exactly the three host ports this job
  # needs, and `--wait` gates readiness on the healthchecks in
  # compose.yml.
  #
  # `scripts/check-image-pins.sh` covers what is left: the job container
  # in ci-e2e.yml cannot come from compose.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NOOMBAT_DATABASE_URL: postgres://noombat:noombat@localhost/noombat
      DATABASE_URL: postgres://noombat:noombat@localhost/noombat
      NOOMBAT_DOMAIN: localhost
      NOOMBAT_PORT: "8443"
      # Read by tests/search_index.rs. Absent, those tests skip, so this
      # is what makes them run rather than quietly pass.
      MEILI_URL: http://localhost:7700
      MEILI_KEY: ci-test-key
      # Consumed by compose.yml's `${MEILI_MASTER_KEY:-noombat-dev-key}`,
      # so the key the services start with is the one MEILI_KEY presents.
      MEILI_MASTER_KEY: ci-test-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start services (compose.yml, the same images deployments use)
        run: |
          docker compose -f compose.yml -f compose.dev.yml \
            up -d --wait db redis meilisearch
      # The test job's entry: the same paths and key, because both jobs
      # compile the same artefacts (`--include-ignored` changes what runs,
      # not what is built), so one entry serves both.
      - name: Cache Cargo artefacts
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Read the sqlx version from Cargo.lock
        # sqlx-cli is released with sqlx under the same version, so the CLI
        # that runs the migrations follows the library a bump moves.
        id: sqlx
        run: |
          version=$(awk '/^name = "sqlx"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          # Exactly one version: two locked copies would print two lines.
          case "$version" in
            "" | *[!0-9.]*)
              echo "::error::need one sqlx version in Cargo.lock, found: ${version:-none}"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache sqlx-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-${{ steps.sqlx.outputs.version }}
      - name: Install sqlx-cli
        env:
          SQLX_CLI_VERSION: ${{ steps.sqlx.outputs.version }}
        run: |
          # The cached binary is used only at the version wanted.
          sqlx --version 2>/dev/null | grep -qwF -- "$SQLX_CLI_VERSION" \
            || cargo install "sqlx-cli@$SQLX_CLI_VERSION" --locked --force \
              --no-default-features --features postgres,rustls
      - name: Run migrations
        run: sqlx migrate run --source migrations
      # `--include-ignored` picks up the `#[sqlx::test]` tests that the
      # DB-less `test` job skips. Without it they would never run
      # anywhere, and would rot unnoticed.
      - run: cargo test --workspace --no-fail-fast -- --include-ignored
      - name: Dump the service logs on failure
        if: failure()
        run: docker compose -f compose.yml -f compose.dev.yml logs --no-color db redis meilisearch

  # ..... ON-DEMAND RELEASE BUILD .....

  release-build:
    name: Release build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Cargo artefacts
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build release binary
        run: cargo build --release --bin noombat

      - name: Install Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Build frontend assets
        working-directory: frontend
        run: |
          ../scripts/install-pnpm.sh package.json
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload release binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noombat-release
          path: target/release/noombat
          retention-days: 30

      - name: Upload frontend assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noombat-frontend
          path: frontend/dist/
          # Vite's manifest is in the hidden `.vite/`, which the server needs.
          include-hidden-files: true
          retention-days: 30
