# GitHub Actions CI pipeline for Rust-focused jobs.
#
# Gated on paths that affect Rust compilation, linting, formatting,
# dependency auditing, or database-backed integration tests. Commits
# that touch only documentation, licence files, shell scripts,
# container definitions, or CI infrastructure that does not affect
# the Rust build are skipped.
#
# All jobs run on GitHub-hosted runners (`ubuntu-latest`). The
# `integration` job additionally uses PostgreSQL, Redis and Meilisearch
# service containers.
#
# Related workflows:
#   ci-reuse.yml            REUSE licence compliance (unconditional).
#   ci-e2e.yml              Playwright end-to-end and federation interop tests.
#   verify.yml              Server and chatmail container image builds.

name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "crates/**"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "rustfmt.toml"
      - "scripts/check-action-allowlist.sh"
      - "scripts/check-image-pins.sh"
      - "scripts/check-inline-scripts.sh"
      - "scripts/check-migrations.sh"
      - "scripts/check-template-comments.sh"
      - "scripts/check-typst-injection.sh"
      - "scripts/check-unused-deps.sh"
      - "templates/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "crates/**"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "rustfmt.toml"
      - "scripts/check-action-allowlist.sh"
      - "scripts/check-image-pins.sh"
      - "scripts/check-inline-scripts.sh"
      - "scripts/check-migrations.sh"
      - "scripts/check-template-comments.sh"
      - "scripts/check-typst-injection.sh"
      - "scripts/check-unused-deps.sh"
      - "templates/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      release:
        description: "Build a release binary"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  safe-rust:
    name: Safe Rust only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify all first-party crates forbid unsafe code
        run: |
          FAIL=0
          for crate_dir in crates/*/; do
            crate_name=$(basename "$crate_dir")
            entry=""
            if [ -f "$crate_dir/src/lib.rs" ]; then
              entry="$crate_dir/src/lib.rs"
            elif [ -f "$crate_dir/src/main.rs" ]; then
              entry="$crate_dir/src/main.rs"
            else
              echo "  ?  $crate_name: no lib.rs or main.rs found"
              continue
            fi

            if grep -q 'forbid(unsafe_code)' "$entry"; then
              echo "  ✓  $crate_name"
            else
              echo "  ✗  $crate_name: missing #![forbid(unsafe_code)] in $entry"
              FAIL=$((FAIL + 1))
            fi
          done

          if [ "$FAIL" -gt 0 ]; then
            echo ""
            echo "::error::$FAIL crate(s) missing #![forbid(unsafe_code)]"
            exit 1
          fi

  csp-templates:
    name: Template CSP compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Reject inline script, inline style, and javascript: URLs"
        run: scripts/check-inline-scripts.sh
      # Askama passes HTML through untouched, so an unterminated <!--
      # builds clean and swallows whatever follows it in the rendered
      # page, including markup inherited from the layout.
      - name: "Reject unbalanced HTML comment delimiters"
        run: scripts/check-template-comments.sh

  dependency-hygiene:
    name: Dependency hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A workflow `services:` or `container:` image is the one image
      # reference no updater reaches, so this is the only thing that
      # notices when it drifts from the compose file naming the same
      # image. Deterministic, and blocking for that reason.
      - name: "Assert workflow images are pinned and agree with compose"
        run: scripts/check-image-pins.sh
      # Advisory: the scan reports candidates, not conclusions, because a
      # dependency can be load-bearing without being named anywhere, by
      # enabling a feature or registering a runtime provider. Failing on a
      # heuristic would eventually block an urgent bump. Drop
      # `continue-on-error` to make it a gate.
      - name: "Report dependencies nothing imports"
        continue-on-error: true
        run: scripts/check-unused-deps.sh

  actions-policy:
    name: Actions policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A `uses:` the policy refuses does not fail a job, it makes the
      # whole workflow startup_failure: no jobs, so no check runs, so the
      # commit reads green while nothing ran. This is the only thing that
      # reports it before a push.
      - name: "Reject actions the repository policy will not run"
        run: scripts/check-action-allowlist.sh

  migration-shape:
    name: Migration shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Reject duplicate versions and irreversible migrations"
        run: scripts/check-migrations.sh

  typst-injection:
    name: Typst injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Cargo artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-typst-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-typst-
      # Compiles the emitter's corpus with the real Typst binary. The
      # unit tests assert that no user text leaves a string literal in
      # the generated source; only the compiler can say what Typst then
      # does with it.
      - name: "Assert hostile CV markup compiles to inert text"
        run: scripts/check-typst-injection.sh
      # The compile bounds need typst on PATH inside the test process,
      # which the script's container cannot provide. This is the only
      # job where that test actually runs: everywhere else it skips.
      - name: Install the pinned typst binary
        run: |
          # Read from the Dockerfile so the binary under test is the one
          # the runtime ships. See scripts/check-typst-injection.sh.
          image=$(sed -n 's/^FROM \(ghcr\.io\/typst\/typst:[^ ]*\) AS typst$/\1/p' Dockerfile)
          [ -n "$image" ] || { echo "no typst stage in Dockerfile" >&2; exit 1; }
          cid=$(docker create "$image")
          docker cp "$cid:/bin/typst" /usr/local/bin/typst
          docker rm "$cid"
          typst --version
      - name: "Assert a slow compilation is killed, not abandoned"
        run: cargo test -p noombat-identity --lib -- --include-ignored a_slow_compile

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Cargo artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deny-0.20.2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deny-0.20.2-
      # Pinned, and asserted rather than assumed. cargo-deny releases
      # change what deny.toml may contain: 0.18.6 rejects its `unsound`
      # key outright while 0.20.2 accepts it, so an unpinned install is a
      # job that can fail on configuration rather than on a finding.
      # Testing the version rather than the binary's presence matters
      # because the cache restores whatever it last held.
      - name: Install cargo-deny
        run: |
          cargo deny --version 2>/dev/null | grep -qx 'cargo-deny 0.20.2' \
            || cargo install cargo-deny --locked --version 0.20.2 --force
      - run: cargo deny check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Cargo artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-clippy-
      # `--all-targets` so test and bench code is linted too. Without it
      # everything under `#[cfg(test)]` is never compiled by this job,
      # which is how a `nonminimal_bool` in middleware.rs stayed green
      # from July onwards.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Cargo artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-
      # No database here, so the `#[ignore]`d `#[sqlx::test]` tests are
      # skipped. The `integration` job below runs them.
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.94.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install MSRV toolchain
        run: |
          rustup install 1.94.0
          rustup default 1.94.0
      - name: Cache Cargo artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.rustup/toolchains
            target
          key: cargo-msrv-1.94.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-msrv-1.94.0-
      - run: cargo check --workspace

  # The services come from the compose files rather than a `services:`
  # block, and that is deliberate.
  #
  # A `services:` block is the one place an image reference can sit where
  # no updater will ever propose it: Dependabot's docker ecosystem reads
  # Dockerfiles, docker-compose reads compose files, and github-actions
  # reads `uses:`. This job used to repeat postgres, redis and meilisearch
  # from compose.yml, and PR #48 duly bumped Meilisearch there and left
  # the copy here behind, which would have had CI asserting against one
  # Meilisearch while every deployment ran another. The two copies had
  # also already drifted in a quieter way: compose pinned all three by
  # digest, while this block ran floating `postgres:18-alpine` and
  # `redis:8-alpine` tags.
  #
  # Naming them in one place removes that, and compose.dev.yml already
  # publishes exactly the three host ports this job needs. Readiness is
  # gated by `--wait` against the healthchecks in compose.yml, which is
  # why redis and meilisearch grew one; postgres always had it.
  #
  # `scripts/check-image-pins.sh` enforces what is left: the job container
  # in ci-e2e.yml cannot come from compose, so it is checked instead.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      NOOMBAT_DATABASE_URL: postgres://noombat:noombat@localhost/noombat
      DATABASE_URL: postgres://noombat:noombat@localhost/noombat
      NOOMBAT_DOMAIN: localhost
      NOOMBAT_PORT: "8443"
      NOOMBAT_ADMIN_TOKEN: ci-test-token
      # Read by tests/search_index.rs. Absent, those tests skip, so this
      # is what makes them run rather than quietly pass.
      MEILI_URL: http://localhost:7700
      MEILI_KEY: ci-test-key
      # Consumed by compose.yml's `${MEILI_MASTER_KEY:-noombat-dev-key}`,
      # so the key the services start with is the one MEILI_KEY presents.
      MEILI_MASTER_KEY: ci-test-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start services (compose.yml, the same images deployments use)
        run: |
          docker compose -f compose.yml -f compose.dev.yml \
            up -d --wait db redis meilisearch
      - name: Cache Cargo artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-integration-
      - name: Install sqlx-cli
        run: |
          command -v sqlx >/dev/null || cargo install sqlx-cli@0.9.0 \
            --locked --no-default-features --features postgres,rustls
      - name: Run migrations
        run: sqlx migrate run --source migrations
      # `--include-ignored` picks up the `#[sqlx::test]` tests that the
      # DB-less `test` job skips. Without it they would never run
      # anywhere, and would rot unnoticed.
      - run: cargo test --workspace -- --include-ignored

  # ..... ON-DEMAND RELEASE BUILD .....

  release-build:
    name: Release build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Cargo artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-

      - name: Build release binary
        run: cargo build --release --bin noombat

      - name: Install Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Build frontend assets
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload release binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noombat-release
          path: target/release/noombat
          retention-days: 30

      - name: Upload frontend assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noombat-frontend
          path: frontend/dist/
          retention-days: 30
