# Verify that the Dockerfile builds successfully.
#
# Gated to paths that affect the container image.
# Does not push, i.e. the image is discarded after the job.

name: Container build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/container-build.yml"
      - "Dockerfile"
      - "compose.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**/Cargo.toml"
      - "templates/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/container-build.yml"
      - "Dockerfile"
      - "compose.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**/Cargo.toml"
      - "templates/**"

jobs:
  container-build:
    name: Container image build
    runs-on: self-hosted
    container:
      image: docker.io/library/node:22-alpine
      options: "-v /var/run/docker.sock:/var/run/docker.sock"
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Install dependencies
        run: apk add --no-cache docker-cli docker-cli-buildx git
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build --tag noombat:ci-test .
