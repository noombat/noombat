# GitHub Actions CI pipeline for Dockerfiles build success verification.
#
# Gated to paths that affect either container image.
# Does not push, i.e. images are discarded after the job.

name: Container build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/container-build.yml"
      - "Dockerfile"
      - "Dockerfile.chatmail"
      - "chatmail-config/**"
      - "compose.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "frontend/**"
      - "templates/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/container-build.yml"
      - "Dockerfile"
      - "Dockerfile.chatmail"
      - "chatmail-config/**"
      - "compose.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "frontend/**"
      - "templates/**"

permissions:
  contents: read

jobs:
  container-build:
    name: Container image build
    runs-on: self-hosted
    container:
      image: docker.io/library/node:22-alpine
      options: "-v /var/run/docker.sock:/var/run/docker.sock"
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Install dependencies
        run: apk add --no-cache docker-cli docker-cli-buildx git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build server container image
        run: docker build --tag noombat:ci-test .
      - name: Build chatmail container image
        run: docker build --file Dockerfile.chatmail --tag noombat-chatmail:ci-test .
