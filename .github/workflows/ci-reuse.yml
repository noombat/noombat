# GitHub Actions CI pipeline for REUSE licence-compliance check.
#
# Runs unconditionally on every push and pull request because any file
# addition or header modification can introduce a REUSE violation.

name: REUSE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install reuse
        run: pip install --break-system-packages reuse==6.2.0
      - run: reuse lint
