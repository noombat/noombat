# Federation interop against whatever GoToSocial ships today.
#
# The interop job in ci-e2e.yml runs against a digest-pinned GoToSocial,
# so a pull request fails only for reasons that pull request caused. That
# is the right default for the merge path, and it has a cost: a change in
# the peer implementation becomes invisible until somebody bumps the pin,
# and a peer changing under you is exactly the breakage a federation suite
# is for.
#
# This runs the same harness with the pin lifted, on a schedule. Drift is
# then reported against the calendar rather than against whoever pushed
# next, and a failure here says "upstream moved" rather than "your branch
# is broken", which are different problems with different owners.
#
# A failure is expected to be actionable rather than urgent: read the
# logs, decide whether Noombat or GoToSocial changed, and either fix
# Noombat or bump the pin in tests/interop/compose.yml.

name: Interop (GoToSocial latest)

on:
  schedule:
    # Mondays, after Dependabot's weekly run, so a pin bump and this
    # report land in the same review session.
    # Minute 23 rather than 0: GitHub drops scheduled runs under load and
    # the top of the hour is the most contended. This workflow missed its
    # first window at minute 0 while startup-watch fired at minute 17.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop-latest:
    name: Federation interop (GoToSocial latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Map the interop hostnames
        run: echo "127.0.0.1 noombat.localhost gotosocial.localhost" | sudo tee -a /etc/hosts

      - name: Record which GoToSocial this is
        run: |
          docker pull docker.io/superseriousbusiness/gotosocial:latest
          docker image inspect docker.io/superseriousbusiness/gotosocial:latest \
            --format 'GoToSocial digest: {{index .RepoDigests 0}}'

      - name: Build the Noombat image
        working-directory: tests/interop
        run: |
          # bake resolves a compose file's `context` and `dockerfile`
          # against the WORKING DIRECTORY, while compose resolves them
          # against the file. `context: ../..` therefore only means the
          # repository root when bake runs from the file's own directory,
          # which is why this step sets working-directory and passes a
          # bare -f. From the root it reads a Dockerfile that is not
          # there and fails with `transferring dockerfile: 2B`.
          #
          # --allow because that context is still outside the compose
          # file's directory, which bake will not read unprompted.
          # Granted rather than disabled via BUILDX_BAKE_ENTITLEMENTS_FS=0,
          # so a context that later reaches somewhere unexpected still has
          # to be granted.
          docker buildx bake --allow=fs.read='*' -f compose.yml \
            --load \
            --set '*.cache-from=type=gha' \
            --set '*.cache-to=type=gha,mode=max'

      - name: Start the interop stack against latest
        run: |
          docker compose -f tests/interop/compose.yml \
            -f tests/interop/compose.latest.yml up -d --wait

      - name: Wait for Noombat through Caddy
        run: |
          for i in $(seq 1 30); do
            if curl -ksf https://noombat.localhost:8443/healthz >/dev/null; then
              echo "Noombat is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Noombat did not become ready within 60 seconds"
          docker compose -f tests/interop/compose.yml \
            -f tests/interop/compose.latest.yml logs --no-color
          exit 1

      # Both files, so `compose exec` resolves against the same
      # configuration the stack was started with rather than relying on
      # the project name happening to match.
      - name: Seed both instances
        run: |
          tests/interop/seed.sh \
            tests/interop/compose.yml tests/interop/compose.latest.yml

      - name: Run interop tests
        env:
          CURL_OPTS: "--insecure"
        run: tests/interop/run.sh https://noombat.localhost:8443 https://gotosocial.localhost:8443

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f tests/interop/compose.yml \
            -f tests/interop/compose.latest.yml logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose -f tests/interop/compose.yml \
            -f tests/interop/compose.latest.yml down -v
