# The CV renderer against the Typst binary the server image ships.
#
# The compiler under test is read from the Dockerfile's typst stage, so a
# change to the Dockerfile alone must run this job: that is how a
# Dependabot Typst bump arrives. Its own workflow, so a base-image bump
# runs this job and not the whole Rust suite.

name: Typst injection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/typst.yml"
      - "Dockerfile"
      - "crates/**"
      - "migrations/**"
      - "templates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/check-typst-injection.sh"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/typst.yml"
      - "Dockerfile"
      - "crates/**"
      - "migrations/**"
      - "templates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/check-typst-injection.sh"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # A smaller target/: no incremental state, and line tables rather
  # than full debug information, which keeps file and line in a test's
  # backtrace.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Caches that hold target/ are skipped on pull requests, which build
# cold: a pull request's entry counts against the repository's cache
# budget although main cannot restore it. Elsewhere they are restored
# by their exact key only, because restoring an older target/ and saving
# it again grows the entry on every lockfile change.

jobs:
  typst-injection:
    name: Typst injection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Cargo artefacts
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-typst-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      # Compiles the emitter's corpus with the real Typst binary. The
      # unit tests assert that no user text leaves a string literal in
      # the generated source; only the compiler can say what Typst then
      # does with it.
      - name: "Assert hostile CV markup compiles to inert text"
        run: scripts/check-typst-injection.sh
      # The compile bounds need typst on PATH inside the test process,
      # which the script's container cannot provide. This is the only
      # job where that test actually runs: everywhere else it skips.
      - name: Install the pinned typst binary
        id: typst
        if: ${{ !cancelled() }}
        run: |
          # Read from the Dockerfile so the binary under test is the one
          # the runtime ships. See scripts/check-typst-injection.sh.
          image=$(sed -n 's/^FROM \(ghcr\.io\/typst\/typst:[^ ]*\) AS typst$/\1/p' Dockerfile)
          [ -n "$image" ] || { echo "no typst stage in Dockerfile" >&2; exit 1; }
          cid=$(docker create "$image")
          docker cp "$cid:/bin/typst" /usr/local/bin/typst
          docker rm "$cid"
          typst --version
      # The test skips itself when typst is absent, because
      # `--include-ignored` also runs it in the integration job and in the
      # build image, neither of which has the binary. This is the one job
      # that installs it, so this is the one job that refuses the skip:
      # without the variable, a broken install step above would leave the
      # timeout unmeasured and the job green.
      - name: "Assert a slow compilation is killed, not abandoned"
        if: ${{ !cancelled() && steps.typst.outcome == 'success' }}
        env:
          NOOMBAT_REQUIRE_TYPST: "1"
        run: cargo test -p noombat-identity --lib -- --include-ignored a_slow_compile
      # The CV render test reads the typeset PDF back with pdftotext,
      # which the runner image may lack.
      - name: Install pdftotext
        id: pdftotext
        if: ${{ !cancelled() && steps.typst.outcome == 'success' }}
        run: |
          command -v pdftotext || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          }
          pdftotext -v
      # Held to NOOMBAT_REQUIRE_TYPST for the reason the slow-compile
      # step is.
      - name: "Assert the default CV template typesets every section"
        if: ${{ !cancelled() && steps.pdftotext.outcome == 'success' }}
        env:
          NOOMBAT_REQUIRE_TYPST: "1"
        run: cargo test -p noombat-identity --test cv_render -- --include-ignored
