# GitHub Actions CI pipeline for end-to-end and federation interoperability tests.
#
# The path filter below triggers these jobs only when the change set
# includes files that can affect the built server binary, the frontend
# assets, the database schema, or the test suites themselves.
# Documentation, licence files, and CI-infrastructure changes that
# do not touch the artefact are excluded.

name: E2E & interop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-e2e.yml"
      - "crates/**"
      - "frontend/**"
      - "migrations/**"
      - "templates/**"
      - "tests/chat-interop/**"
      - "tests/e2e/**"
      - "tests/interop/**"
      - "Dockerfile"
      - "Dockerfile.chatmail"
      - "chatmail-config/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci-e2e.yml"
      - "crates/**"
      - "frontend/**"
      - "migrations/**"
      - "templates/**"
      - "tests/chat-interop/**"
      - "tests/e2e/**"
      - "tests/interop/**"
      - "Dockerfile"
      - "Dockerfile.chatmail"
      - "chatmail-config/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  e2e:
    name: End-to-end tests (Firefox, Chromium, WebKit)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: "--shm-size=2g --ipc=host"
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: noombat
          POSTGRES_PASSWORD: noombat
          POSTGRES_DB: noombat
        options: >-
          --health-cmd "pg_isready -U noombat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOME: /root
      NOOMBAT_DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      NOOMBAT_DOMAIN: localhost
      NOOMBAT_PORT: "8443"
      # Session authentication, which the server enables only when this
      # is set. Without it every page behind `require_auth` is reachable
      # by no credential the suite can present: the admin bearer below
      # resolves to a principal with no actor id, and with no username
      # either on any path outside /users/{name} and /@{name}, so /chat,
      # /settings/chat, /compose, /auth/upgrade and every /settings page
      # answer 307 to /auth/login. A fixture for a throwaway instance,
      # not a secret.
      NOOMBAT_JWT_SECRET: ci-e2e-jwt-secret-at-least-32-bytes-long
      # The server reads NOOMBAT_ADMIN_TOKEN; the Playwright suite presents
      # ADMIN_TOKEN. Both names are needed and the values must match: the
      # suite skips its admin group when its own variable is empty, so
      # setting only the server's silently dropped 21 of the 29
      # accessibility tests. accessibility.spec.ts now refuses to skip
      # under CI rather than let that recur.
      NOOMBAT_ADMIN_TOKEN: ci-test-token
      ADMIN_TOKEN: ci-test-token
      # Effectively disable per-IP rate limiting for the e2e run.
      # The values mirror the test overlay in compose.test.yml.
      NOOMBAT_RATE_LIMIT: "10000"
      NOOMBAT_FED_RATE_LIMIT: "10000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential pkg-config postgresql-client

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-e2e-

      - name: Install sqlx-cli and run migrations
        run: |
          command -v sqlx >/dev/null || cargo install sqlx-cli@0.9.0 \
            --locked --no-default-features --features postgres,rustls
          sqlx migrate run --source migrations

      - name: Build Noombat server
        run: cargo build --release --bin noombat

      - name: Build frontend assets
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Generate the served asset manifest
        # Without this, /.well-known/noombat/assets.json 404s and the
        # asset-provenance test skips silently. A skipped test provides
        # no protection, and the gap it covers, i.e. a page loading a
        # script the manifest does not name, is the one the manifest
        # alone cannot detect.
        run: scripts/asset-manifest.sh > frontend/dist/assets-manifest.json

      - name: Seed test actor and article
        # post_type 'article' is load-bearing. The post route renders
        # article.html only for that value; a Note permalink takes a
        # different branch and would leave the article template rendered
        # by nothing, which is the state that let a broken one ship. The
        # id is fixed so the specs can address the permalink without
        # discovering it first; scripts/e2e-stack.sh and
        # tests/e2e/smoke.spec.ts hard-code the same value.
        run: |
          PGPASSWORD=noombat psql -h postgres -U noombat -d noombat -c "
            INSERT INTO actors
              (actor_type, ap_id, username, domain, public_key_pem, is_local)
            VALUES
              ('individual', 'http://localhost:8443/users/testuser',
               'testuser', 'localhost',
               '-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0placeholder
          -----END PUBLIC KEY-----',
               TRUE)
            ON CONFLICT (ap_id) DO NOTHING;

            INSERT INTO posts
              (id, actor_id, ap_id, post_type, title, content_md, content_html,
               visibility, ap_object)
            SELECT
              '00000000-0000-4000-8000-000000000001',
              a.id,
              'http://localhost:8443/users/testuser/posts/00000000-0000-4000-8000-000000000001',
              'article',
              'Seeded Test Article',
              E'## Introduction\n\nThis article is seeded so the permalink has something to render.\n\n## Second section\n\nA second heading, so the table of contents holds more than one entry.',
              '<h2 id=\"introduction\">Introduction</h2><p>This article is seeded so the permalink has something to render.</p><h2 id=\"second-section\">Second section</h2><p>A second heading, so the table of contents holds more than one entry.</p>',
              'public',
              jsonb_build_object(
                '@context', 'https://www.w3.org/ns/activitystreams',
                'type', 'Create',
                'actor', 'http://localhost:8443/users/testuser',
                'object', jsonb_build_object(
                  'id', 'http://localhost:8443/users/testuser/posts/00000000-0000-4000-8000-000000000001',
                  'type', 'Article',
                  'name', 'Seeded Test Article',
                  'attributedTo', 'http://localhost:8443/users/testuser',
                  'to', jsonb_build_array('https://www.w3.org/ns/activitystreams#Public')))
            FROM actors a
            WHERE a.username = 'testuser' AND a.is_local
            ON CONFLICT DO NOTHING;

            INSERT INTO posts
              (id, actor_id, ap_id, post_type, content_md, content_html,
               visibility, ap_object)
            SELECT
              '00000000-0000-4000-8000-000000000002',
              a.id,
              'http://localhost:8443/users/testuser/posts/00000000-0000-4000-8000-000000000002',
              'note',
              E'A seeded note, so post.html is rendered by something.',
              '<p>A seeded note, so post.html is rendered by something.</p>',
              'public',
              jsonb_build_object(
                '@context', 'https://www.w3.org/ns/activitystreams',
                'type', 'Create',
                'actor', 'http://localhost:8443/users/testuser',
                'object', jsonb_build_object(
                  'id', 'http://localhost:8443/users/testuser/posts/00000000-0000-4000-8000-000000000002',
                  'type', 'Note',
                  'attributedTo', 'http://localhost:8443/users/testuser',
                  'to', jsonb_build_array('https://www.w3.org/ns/activitystreams#Public')))
            FROM actors a
            WHERE a.username = 'testuser' AND a.is_local
            ON CONFLICT DO NOTHING;"

          # Confirmed, not assumed: INSERT ... SELECT inserts nothing and
          # still exits 0 when the actor lookup matches no row.
          #
          # Both posts are checked. `post_type` selects the template, so
          # the article covers article.html and the note covers post.html;
          # seeding one leaves the other rendered by nothing.
          seeded=$(PGPASSWORD=noombat psql -h postgres -U noombat -d noombat -tAc \
            "SELECT count(*) FROM posts
             WHERE (id = '00000000-0000-4000-8000-000000000001' AND post_type = 'article')
                OR (id = '00000000-0000-4000-8000-000000000002' AND post_type = 'note');")
          if [ "$seeded" != "2" ]; then
            echo "::error::the test posts were not seeded ($seeded of 2); the permalink tests would fail"
            exit 1
          fi
          echo "test actor, article and note seeded"

      - name: Start Noombat server
        run: |
          nohup ./target/release/noombat > /tmp/noombat.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8443/healthz; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Server failed to start within 60 seconds"
          cat /tmp/noombat.log
          exit 1

      - name: Install Playwright test dependencies
        working-directory: tests/e2e
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # Run the security-header and CSP suite first and on its own.
      # It is the cheapest of the specs and the one whose failure has
      # the most specific cause, so reporting it separately keeps a
      # header or policy regression from being buried in the full
      # cross-browser matrix below (which also runs it).
      - name: Run security header and CSP tests (Firefox)
        working-directory: tests/e2e
        run: pnpm exec playwright test security-headers.spec.ts --project=firefox

      - name: Run Playwright tests (Firefox)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=firefox

      - name: Run Playwright tests (Chromium)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=chromium

      - name: Run Playwright tests (WebKit)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=webkit

      - name: Run Playwright tests (Firefox mobile viewport)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=firefox-mobile

      - name: Run Playwright tests (Chromium mobile viewport)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=chromium-mobile

      - name: Run Playwright tests (WebKit mobile viewport)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=webkit-mobile

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/noombat.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

  # Runs the harness the repository documents, rather than a second
  # topology maintained only here.
  #
  # This job used to build the server natively, reach services on
  # localhost over plain HTTP with `NOOMBAT_DOMAIN: localhost`, and add an
  # /etc/hosts entry for gotosocial. `tests/interop/compose.yml` describes
  # something materially different: Noombat containerised as
  # `noombat-backend` on the `interop` network, behind Caddy terminating
  # TLS, serving `noombat.localhost:8443`. For a federation test that difference is
  # the test. HTTP Signatures cover `(request-target)` and `host`, so a
  # reverse proxy is part of what is under test. Actor ids are absolute
  # URLs, and `http://localhost:8443/users/alice` is not a shape any peer
  # resolves in the wild. Delivery and WebFinger require the peer to fetch
  # back over the same scheme. None of that was exercised, so proxy header
  # handling and scheme or port leaking into generated URLs could not fail
  # here however broken they were.
  #
  # `run.sh` already documented both invocations. This runs the second,
  # the one a developer runs locally.
  #
  # The Rust build moves into Docker, so `actions/cache` on `target/` no
  # longer applies. buildx with a GitHub Actions cache replaces it; the
  # Dockerfile is already staged so the dependency layers survive a source
  # change.
  interop:
    name: Federation interop (GotoSocial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Caddy serves both names on the published port, so both have to
      # resolve to the runner.
      - name: Map the interop hostnames
        run: echo "127.0.0.1 noombat.localhost gotosocial.localhost" | sudo tee -a /etc/hosts

      - name: Build the Noombat image
        run: |
          docker buildx bake -f tests/interop/compose.yml \
            --load \
            --set '*.cache-from=type=gha' \
            --set '*.cache-to=type=gha,mode=max'

      - name: Start the interop stack
        run: docker compose -f tests/interop/compose.yml up -d --wait

      # `--wait` returns as soon as the containers are up or healthy, which
      # is not the same as Noombat having run its migrations and bound its
      # port behind Caddy. Ask the endpoint the tests will use.
      - name: Wait for Noombat through Caddy
        run: |
          for i in $(seq 1 30); do
            if curl -ksf https://noombat.localhost:8443/healthz >/dev/null; then
              echo "Noombat is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Noombat did not become ready within 60 seconds"
          docker compose -f tests/interop/compose.yml logs --no-color
          exit 1

      # Both accounts, on both instances. run.sh federates between them
      # and neither instance will create them: Noombat has no open
      # registration route and GoToSocial runs with registration closed.
      # Seeding lives in the harness so that the ap_id matches the domain
      # the server actually serves.
      - name: Seed both instances
        run: tests/interop/seed.sh tests/interop/compose.yml

      # GitHub sets CI, and run.sh treats a skip as a failure and an
      # unreachable peer as fatal when it is set. Both are assertions
      # that did not run, which is not a suite that passed.
      - name: Run interop tests
        env:
          # Caddy issues its own certificate for these names.
          CURL_OPTS: "--insecure"
        run: tests/interop/run.sh https://noombat.localhost:8443 https://gotosocial.localhost:8443

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f tests/interop/compose.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f tests/interop/compose.yml down -v

  # The Chatmail half of the system: the relay image and the admin
  # sidecar the server talks to.
  #
  # The sidecar is why this cannot be left to the relay's own
  # healthcheck, which is an IMAP NOOP that Dovecot answers whether or
  # not the sidecar is running. Password rotation, doveadm kick, maildir
  # deletion and transport_maps can all be dead while the container
  # reports healthy, so the suite asserts the sidecar directly.
  #
  # The e2e job above runs a server with no Chatmail domain set and never
  # calls the chat API, so registration on a chat-enabled instance, the
  # chat WebSocket route and chat reports are exercised only here.
  chat-interop:
    name: Chat interop (Chatmail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Two images: the server from Dockerfile, the relay and its sidecar
      # from Dockerfile.chatmail.
      #
      # The tags are set explicitly. A compose service that names no
      # image bakes to a dangling image, which `up` cannot find, so it
      # would build the pair a second time and out of this cache. The
      # names are the ones compose derives from the project, which is why
      # every compose call below pins `-p chat-interop` rather than
      # letting it default to the directory name.
      #
      # The cache scope is this job's own: it bakes a different graph
      # from the federation job and sharing a scope has them evict each
      # other.
      - name: Build the stack images
        run: |
          docker buildx bake -f tests/chat-interop/compose.yml \
            --load \
            --set 'noombat.tags=chat-interop-noombat' \
            --set 'chatmail.tags=chat-interop-chatmail' \
            --set '*.cache-from=type=gha,scope=chat-interop' \
            --set '*.cache-to=type=gha,scope=chat-interop,mode=max'

      - name: Start the chat interop stack
        run: |
          docker compose -p chat-interop -f tests/chat-interop/compose.yml \
            up -d --wait

      # `--wait` returns once the containers are running, which is not the
      # same as Noombat having migrated or s6 having started the sidecar.
      # Poll both endpoints the suite uses, so a slow start reports here,
      # with logs, instead of as a failed assertion.
      - name: Wait for Noombat and the Chatmail admin sidecar
        run: |
          for _ in $(seq 1 45); do
            health=$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:8443/healthz || true)
            # Admin routes all require the shared secret and there is no
            # health route, so an unauthenticated 401 is the only
            # liveness signal the sidecar offers.
            admin=$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:9100/admin/v1/accounts/probe@example.invalid/exists || true)
            if [ "$health" = "200" ] && [ "$admin" = "401" ]; then
              echo "Noombat and the Chatmail admin sidecar are ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the chat interop stack was not ready within 90 seconds (healthz=$health, admin=$admin)"
          docker compose -p chat-interop -f tests/chat-interop/compose.yml \
            logs --no-color
          exit 1

      # GitHub sets CI, and run.sh treats a skip as a failure when it is
      # set. Its skips are all "no token", i.e. assertions that never ran.
      - name: Run chat interop tests
        run: tests/chat-interop/run.sh http://localhost:8443

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -p chat-interop -f tests/chat-interop/compose.yml \
            logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose -p chat-interop -f tests/chat-interop/compose.yml \
            down -v
