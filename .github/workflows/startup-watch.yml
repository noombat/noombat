# Report a workflow that GitHub rejected before it ran.
#
# A rejected workflow concludes `startup_failure`, creating no jobs and
# therefore no check runs, so the commit shows every other check green
# and the rejected one is simply absent. That is indistinguishable from
# "not triggered" on the commit page, and it hid three dead jobs for a
# day.
#
# Scheduled rather than triggered by push, deliberately: a job in one
# workflow cannot see whether another has concluded yet, so checking on
# the same event would race. This looks some time after the fact, which
# is when the answer is stable, at every run of the last two days on any
# branch: a path-filtered workflow creates no run on a commit outside its
# paths, so main's head alone misses a rejection on an earlier commit or
# a pull request branch.

name: Startup watch

on:
  schedule:
    # Daily. The two-day window covers the hours a scheduled run can
    # start late, at the cost of reporting a rejection on two days.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-watch:
    name: Rejected workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Report any workflow rejected at startup in the last two days"
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-workflow-startup.sh --since "$(date -u -d '-2 days' +%Y-%m-%dT%H:%M:%SZ)"
