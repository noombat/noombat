# GitHub Actions CI pipeline for CI container image generation.
#
# Builds and publishes the CI container image to ghcr.io/noombat/noombat-ci.
# Triggered on changes to the Dockerfile or toolchain, or manually.

name: CI image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile.ci"
      - "rust-toolchain.toml"

jobs:
  build-ci-image:
    name: Build and publish CI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/noombat-ci:latest
            ghcr.io/${{ github.repository_owner }}/noombat-ci:${{ github.sha }}
