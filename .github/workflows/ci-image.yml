# GitHub Actions CI pipeline for CI container image generation.
#
# Builds and publishes the CI container image to ghcr.io/noombat/noombat-ci.
# Triggered on changes to the Dockerfile or toolchain, or manually.

name: CI image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile.ci"
      - "rust-toolchain.toml"

jobs:
  build-ci-image:
    name: Build and publish CI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/noombat-ci:latest
            ghcr.io/${{ github.repository_owner }}/noombat-ci:${{ github.sha }}
