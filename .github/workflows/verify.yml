# Build-only verification. Nothing is pushed to any registry.
#
# Both images are built with scripts/build-image.sh, the same entry
# point release.yml uses, so this job verifies the invocation that
# actually ships rather than a second copy of it that can drift.
#
# Related workflows:
#   release.yml      Builds, attests, signs, and publishes on a version tag.
#   ci.yml           Rust checks.
#   ci-frontend.yml  Frontend checks.

name: Container build verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify.yml"
      - "Dockerfile"
      - "Dockerfile.chatmail"
      - "chatmail-config/**"
      - "compose.yml"
      # The certificate gate's own inputs. Without these a change to the
      # production Caddyfile, or to the local ACME harness that tests it,
      # would not run the check that covers them.
      - "Caddyfile"
      - "Caddyfile.acme"
      - "compose.acme.yml"
      - "tests/acme/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "frontend/**"
      - "scripts/**"
      - "templates/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify.yml"
      - "Dockerfile"
      - "Dockerfile.chatmail"
      - "chatmail-config/**"
      - "compose.yml"
      # The certificate gate's own inputs. Without these a change to the
      # production Caddyfile, or to the local ACME harness that tests it,
      # would not run the check that covers them.
      - "Caddyfile"
      - "Caddyfile.acme"
      - "compose.acme.yml"
      - "tests/acme/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "frontend/**"
      - "scripts/**"
      - "templates/**"

permissions:
  contents: read

jobs:
  # A separate job, not a step in `verify` below: this is three seds over
  # two files and has no business waiting seven minutes behind two image
  # builds to report a one-word disagreement.
  conventions:
    name: Chatmail conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The relay entrypoint and the setup wizard both name the DKIM
      # selector. A disagreement makes the relay emit signatures no
      # receiver can verify, which receivers treat worse than an absent
      # one.
      #
      # The deployment guide names it too and is deliberately not an input
      # to this gate: it is prose, and docs/ is held back, so parsing it
      # would mean comparing against a file no CI checkout contains.
      - name: "Assert the relay and the wizard name the same DKIM selector"
        run: scripts/check-dkim-selector.sh

  verify:
    name: Build both images
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # scripts/build-image.sh derives a version label from tags.
          fetch-depth: 0

      - name: Build the server image
        run: scripts/build-image.sh Dockerfile noombat-server:verify

      - name: Build the chatmail image
        run: scripts/build-image.sh Dockerfile.chatmail noombat-chatmail:verify

      - name: Assert the relay acquires, imports and reloads a certificate
        # Here rather than in ci.yml, which is gated on paths that
        # affect the Rust build and so would not run on a change to the
        # Caddyfile or the entrypoint. This job has already built the
        # image, so the gate costs the harness run and not a second
        # build.
        #
        # What it covers is the reload after a renewal, which is the step
        # that fails silently: Postfix and Dovecot read the chain once, so
        # a renewed file changes nothing they serve, and the relay reports
        # healthy while every client fails the handshake.
        run: scripts/check-chatmail-cert.sh

      - name: Assert the relay carries only encrypted mail, and signs it
        # Reuses the image built above, as the certificate gate does.
        #
        # Sends real mail through the relay: plaintext must be refused
        # mid-conversation with nothing queued and no bounce, which no
        # unit test can reach, and the accepted message's signature is
        # verified against the key the relay generated.
        env:
          IMAGE: noombat-chatmail:verify
        run: scripts/check-relay-invariants.sh

      - name: Check the served asset manifest is labelled
        # A manifest reporting "unknown" names no release, so nothing
        # can be compared against it; such an image is not releasable.
        run: |
          manifest=$(docker run --rm --entrypoint cat noombat-server:verify \
            /opt/noombat/frontend/dist/assets-manifest.json)
          echo "$manifest" | head -4
          case "$manifest" in
            *'"version": "unknown"'*|*'"commit": "unknown"'*)
              echo "::error::asset manifest is unlabelled; build args did not reach the frontend stage"
              exit 1 ;;
          esac
          test "$(echo "$manifest" | grep -c '\": \"')" -gt 3 \
            || { echo "::error::asset manifest lists no assets"; exit 1; }

      - name: Generate the image content manifests
        # Exercises scripts/image-manifest.sh on both images, so a
        # release is not the first time it runs.
        run: |
          scripts/image-manifest.sh noombat-server:verify \
            /opt/noombat /usr/local/bin > server-image-manifest.json
          scripts/image-manifest.sh noombat-chatmail:verify \
            /usr/local/bin /etc/postfix /etc/dovecot /entrypoint.sh \
            > chatmail-image-manifest.json

          for m in server-image-manifest.json chatmail-image-manifest.json; do
            files=$(jq '.files | length' "$m")
            packages=$(jq '.packages | length' "$m")
            echo "$m: $files files, $packages packages"

            # Reported separately, and without dumping the manifest: an
            # empty section means the collection step failed, and which
            # one it was points straight at the cause.
            if [ "$files" -eq 0 ]; then
              echo "::error::$m lists no files; the find/sha256sum pass produced nothing"
              exit 1
            fi
            if [ "$packages" -eq 0 ]; then
              echo "::error::$m lists no packages; the dpkg-query pass produced nothing"
              exit 1
            fi
          done

      - name: Upload the manifests for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-manifests
          path: |
            server-image-manifest.json
            chatmail-image-manifest.json
          retention-days: 14
