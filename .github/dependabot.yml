# Dependabot configuration: keeps pinned dependencies current.
#
# Covers five ecosystems:
#   1. github-actions    SHA-pinned action references in workflows.
#   2. cargo             Rust crate dependencies (Cargo.lock).
#   3. npm               Frontend assets and Playwright test harness.
#   4. docker            Base images in Dockerfiles.
#   5. docker compose    Digest-pinned service images.
#
# Minor and patch updates within each ecosystem are grouped into a
# single pull request to reduce review noise. Major updates are
# proposed individually so that breaking changes receive dedicated
# review.
#
# Every group therefore carries `update-types: [minor, patch]`. Omitting
# it does not mean "the default", it means the group swallows majors too:
# that is how one "service images" pull request came to propose
# PostgreSQL 16 to 18, Redis 7 to 8 and Meilisearch v1.12 to v1.51 at
# once, and how a Typst patch arrived bundled with Node 22 to 26.
#
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # 1. GitHub Actions: SHA-pinned action references.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # 2. Cargo: Rust workspace dependencies.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # 3a. npm: Frontend assets (SolidJS, KaTeX, Vite, TailwindCSS).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "deps(frontend)"
      include: scope
    ignore:
      # @types/node describes the runtime, so it has to track the runtime
      # rather than the newest release. Node is pinned to 24, the current
      # Active LTS, in three places: .nvmrc, the `engines` field in
      # frontend/package.json, and the `node:24` frontend stage in the
      # Dockerfile. Without this rule Dependabot reopens the same major
      # indefinitely, because nothing here will ever accept it.
      #
      # Moving to 26 is not just a version bump: Node stopped distributing
      # Corepack at 25.0.0, and `corepack enable` is load-bearing in six
      # jobs across ci-frontend.yml and ci.yml.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # 3b. npm: Playwright end-to-end test harness.
  #     Kept separate from the frontend because the Playwright package
  #     version must stay synchronised with the Playwright container
  #     image declared in ci-e2e.yml.
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - testing
    commit-message:
      prefix: "deps(e2e)"
      include: scope
    ignore:
      # Same reasoning as the frontend: pinned to the Node 24 line.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # 4. Docker: base images across all Dockerfiles.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "deps(docker)"
      include: scope
    groups:
      docker-base-images:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # 5. Docker Compose: digest-pinned service images.
  #    Kept separate from the docker ecosystem, which covers only
  #    Dockerfiles; the compose service images are pinned by digest
  #    and would otherwise never be refreshed.
  #
  #    `directories` rather than `directory`: the file fetcher reads the
  #    named directory non-recursively, so the two compose files under
  #    tests/ were invisible and drifted.
  #
  #    Still NOT covered, and there is no configuration that would cover
  #    it: `services.*.image` inside a workflow file. The github-actions
  #    parser harvests `uses:` and nothing else, and neither docker
  #    ecosystem reads workflows. The seven service images in ci.yml and
  #    ci-e2e.yml must therefore be bumped by hand, in step with the
  #    compose files here.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /tests/interop
      - /tests/chat-interop
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "deps(compose)"
      include: scope
    groups:
      compose-service-images:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
