# Dependabot configuration: keeps pinned dependencies current.
#
# Covers five ecosystems:
#   1. github-actions    SHA-pinned action references in workflows.
#   2. cargo             Rust crate dependencies (Cargo.lock).
#   3. npm               Frontend assets and Playwright test harness.
#   4. docker            Base images in Dockerfiles.
#   5. docker compose    Digest-pinned service images.
#
# Minor and patch updates within each ecosystem are grouped into a
# single pull request to reduce review noise. Major updates are
# proposed individually so that breaking changes receive dedicated
# review.
#
# Every group therefore carries `update-types: [minor, patch]`. Omitting
# it does not mean "the default", it means the group swallows majors too:
# that is how one "service images" pull request came to propose
# PostgreSQL 16 to 18, Redis 7 to 8 and Meilisearch v1.12 to v1.51 at
# once, and how a Typst patch arrived bundled with Node 22 to 26.
#
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # 1. GitHub Actions: SHA-pinned action references.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # 2. Cargo: Rust workspace dependencies.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "deps"
      include: scope
    ignore:
      # sha2 and hmac are held at their digest-0.10 line, and they are held
      # together because neither can move without the other and the code.
      # PRs #53 and #54 proposed them separately and neither can merge.
      #
      # OBSERVED, by making both changes and compiling on 2026-08-17:
      #
      #   sha2 0.11 alone fails in noombat-chatmail-admin with
      #   "the trait bound `Sha256: hmac::digest::core_api::CoreProxy` is
      #   not satisfied". `Hmac<Sha256>` in `noombat-api/src/auth.rs` and
      #   `noombat-chatmail-admin/src/router.rs` needs hmac and sha2 to
      #   share a digest major, and hmac 0.12 is on digest 0.10.
      #
      #   sha2 0.11 with hmac 0.13 gets past that and fails on hmac's own
      #   API change: "no associated function or constant named
      #   `new_from_slice` found for struct `Hmac<D>`". So this is not a
      #   version bump, it is a bump plus a code change at both call sites.
      #
      # INFERRED, and not reached by either build because it stops earlier:
      # rsa is a third constraint behind those two. `delivery.rs` and
      # `routes/federation.rs` build HTTP Signatures as
      # `rsa::pkcs1v15::SigningKey::<sha2::Sha256>` and the matching
      # `VerifyingKey`, handing the workspace `sha2::Sha256` into rsa's
      # generics, while rsa 0.9.10 requires `sha2 ^0.10.6`. Expect two sha2
      # copies and a generic bound that rejects the 0.11 type. Confirm this
      # rather than trusting it when the time comes.
      #
      # rsa has no stable release that takes digest 0.11: as of 2026-08-17
      # crates.io has 0.9.10 stable and 0.10.0-rc.18. When one ships, take
      # rsa, sha2 and hmac plus the two call-site changes as ONE change,
      # and delete both rules.
      #
      # Note these say `semver-major` and mean a 0.x MINOR: for a `0.y.z`
      # version Dependabot's cargo classifier only ever returns "major" or
      # "patch", which is the same rule documented on the askama group.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hmac"
        update-types: ["version-update:semver-major"]
    groups:
      # askama and askama_web must land in ONE pull request, for the same
      # reason as the axe pair below: the wrapper hard-pins the engine to a
      # single 0.x minor. Every askama_web release ever published declares
      # askama at exactly one minor (0.14.7 requires `askama ^0.14.0`, 0.16.0
      # requires `^0.16.0`), so bumping either alone leaves Cargo resolving
      # BOTH copies into the lockfile. That is not a warning, it is a hard
      # compile error: `#[derive(Template)]` then implements a trait from one
      # askama while askama_web expects the trait from the other, giving
      # E0277 "there are multiple different versions of crate `askama` in the
      # dependency graph". Verified in both directions, and confirmed that the
      # pair applied together resolves to one copy and compiles.
      #
      # This group deliberately carries NO `update-types`, unlike
      # cargo-minor-patch below, and the reason is specific to Cargo rather
      # than to this crate. Dependabot classifies a 0.x MINOR bump in the
      # Cargo ecosystem as semver-MAJOR: for a `0.y.z` version its cargo
      # classifier only ever returns "major" or "patch", never "minor". So
      # `update-types: [minor, patch]` excludes 0.14 -> 0.16 by design, which
      # is exactly why cargo-minor-patch did not capture these two on
      # 2026-07-21 while correctly grouping twelve other crates the same
      # minute. Adding `minor` here would be a no-op; omitting update-types is
      # what makes the group work.
      #
      # Note this is the OPPOSITE of npm's behaviour, where a 0.x minor is
      # classified as minor and therefore does get swallowed by a
      # [minor, patch] group. See the `0.x` note on frontend-minor-patch
      # below. Do not generalise either rule across ecosystems.
      askama:
        patterns:
          - "askama"
          - "askama_web"
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # 3a. npm: Frontend assets (SolidJS, Vite, TailwindCSS).
  #
  #     Both npm directories are on ESLint 10. They were a major apart
  #     until 2026-08-17, and the history is worth keeping because the
  #     cause was invisible from this file: eslint-plugin-solid 0.14.5
  #     declared its peer range as `^6.0.0 || ^7.0.0 || ^8.0.0 || ^9.0.0`,
  #     so npm resolution could not produce a tree with ESLint 10 here and
  #     Dependabot never proposed one. Across pull requests #1 to #52 every
  #     ESLint major was raised against /tests/e2e, which carries no Solid
  #     plugin, and not one against this directory. typescript-eslint was
  #     never the constraint; 8.67.0 already accepted `^10.0.0`.
  #
  #     PR #52 brought 0.15.0, which widens the peer range to
  #     `^9.0.0 || ^10.0.0`, and the move followed immediately. No `ignore`
  #     rule was ever involved in either direction, which is why there is
  #     none to remove: the constraint lived in a transitive peer range,
  #     and the only symptom visible here was a major that never arrived.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "deps(frontend)"
      include: scope
    ignore:
      # @types/node describes the runtime, so it has to track the runtime
      # rather than the newest release. Node is pinned to 24, the current
      # Active LTS, in three places: .nvmrc, the `engines` field in
      # frontend/package.json, and the `node:24` frontend stage in the
      # Dockerfile. Without this rule Dependabot reopens the same major
      # indefinitely, because nothing here will ever accept it.
      #
      # Moving to 26 is not just a version bump: Node stopped distributing
      # Corepack at 25.0.0, and `corepack enable` is load-bearing in ten
      # jobs across four files: ci-frontend.yml (typecheck, lint, lint-e2e,
      # format, test, reproducible), ci-e2e.yml (e2e, interop), ci.yml
      # (release-build) and release.yml (release). Counted 2026-08-15; the
      # figure here previously said six jobs across two files, which was
      # ci-frontend.yml's share mistaken for the total.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        # A `0.x` release treats its minor as the breaking position, but
        # Dependabot still classifies `0.16 -> 0.18` as a minor, so the
        # `update-types` filter below does not hold it back and the group
        # swallows it. That is not the same failure as the one described
        # at the top of this file, where omitting `update-types` swallows
        # majors; here the filter is present and correct and the version
        # scheme is what differs.
        #
        # katex was the dependency that made the rule above matter, and it
        # was excluded here until 2026-08-16, when the move to the
        # math-core crate took katex, @types/katex and markdown-it out of
        # the frontend entirely; the server now renders both the published
        # Markdown and the editor preview. Pull request #45, katex 0.16.47
        # to 0.18.4, is exactly the bump that exclusion existed to keep out
        # of the group, and it closed unmerged.
        #
        # eslint-plugin-solid takes its place, and the note here was wrong
        # about it until 2026-08-17. It said the `~0.14.5` pin meant the
        # package "can only move by patch and the rule cannot bite it".
        # A tilde range constrains what npm RESOLVES, not what Dependabot
        # PROPOSES: PR #52 rewrote the manifest itself, `~0.14.5` to
        # `~0.15.0`, and arrived inside this group because npm classifies a
        # `0.x` minor as a minor. So a pin is not protection here, and the
        # only thing that keeps a `0.x` minor out of the group is an
        # exclusion.
        #
        # It matters more for this package than it did for katex. Its rules
        # became enforced on 2026-08-17, having been silently discarded by
        # the config beforehand, so a minor bump can now change what CI
        # rejects rather than only what the bundle contains.
        #
        # Add an entry below the next time an unconstrained `0.x`
        # dependency is added here, or the group will carry its breaking
        # changes in under a minor-and-patch label.
        exclude-patterns:
          - "eslint-plugin-solid"
        update-types:
          - minor
          - patch

  # 3b. npm: Playwright end-to-end test harness.
  #     Kept separate from the frontend because the Playwright package
  #     version must stay synchronised with the Playwright container
  #     image declared in ci-e2e.yml.
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - testing
    commit-message:
      prefix: "deps(e2e)"
      include: scope
    ignore:
      # Same reasoning as the frontend: pinned to the Node 24 line.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # axe-core and its Playwright wrapper must land in ONE pull request,
      # because the wrapper hard-pins the engine to a single minor:
      # @axe-core/playwright 4.12.1 depends on `axe-core: ~4.12.1`, and 4.13.0
      # on `~4.13.0`. Bump axe-core alone and pnpm can no longer share one copy,
      # so the tree splits into a top-level axe-core used only for the
      # `AxeResults` type import in axe-fixture.ts and a nested older copy that
      # actually runs every scan. The suite then reports against one engine
      # while the types describe another, and nothing fails to say so.
      #
      # That is not hypothetical: it is the state PRs #30 and #39 were held to
      # avoid on 2026-08-15, and Dependabot could not have warned about it,
      # because eslint-plugin-playwright's peer range is an open `>=8.40.0`.
      #
      # This group deliberately carries NO `update-types`, unlike every other
      # group in this file. The blanket rule at the top of the file exists to
      # stop a group swallowing majors by accident; here it is the point. The
      # pair must move together whatever the bump is, including axe-core 4 to 5.
      # Landing them together is cheap: the wrapper's four dist files are
      # byte-identical between 4.12.1 and 4.13.0, so its release is nothing but
      # the dependency range.
      axe:
        patterns:
          - "axe-core"
          - "@axe-core/*"

  # 4. Docker: base images across all Dockerfiles.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "deps(docker)"
      include: scope
    ignore:
      # The same Node 24 hold both npm ecosystems carry, applied to the
      # image that the `engines` field and `.nvmrc` are pinned against.
      # Without it the hold is only two thirds enforced: the group below
      # cannot suppress this, because majors are deliberately proposed
      # individually rather than grouped, so `node:24 -> node:26` was
      # reopened every Monday and failed the same check each time. The
      # blocker is Corepack, dropped from the Node distribution at
      # 25.0.0; lift this rule in the change that stops relying on it.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-base-images:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # 5. Docker Compose: digest-pinned service images.
  #    Kept separate from the docker ecosystem, which covers only
  #    Dockerfiles; the compose service images are pinned by digest
  #    and would otherwise never be refreshed.
  #
  #    `directories` rather than `directory`: the file fetcher reads the
  #    named directory non-recursively, so the two compose files under
  #    tests/ were invisible and drifted.
  #
  #    Still NOT covered, and there is no configuration that would cover
  #    it: `services.*.image` inside a workflow file. The github-actions
  #    parser harvests `uses:` and nothing else, and neither docker
  #    ecosystem reads workflows. The seven service images in ci.yml and
  #    ci-e2e.yml must therefore be bumped by hand, in step with the
  #    compose files here.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /tests/interop
      - /tests/chat-interop
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "deps(compose)"
      include: scope
    groups:
      compose-service-images:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
