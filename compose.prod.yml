# Production override for Noombat.
#
# Usage:
#   podman compose -f compose.yml -f compose.prod.yml up -d
#
# This file adds:
# - A Caddy reverse proxy with automatic TLS via Let's Encrypt.
# - Resource limits on all services.
# - Restart policies for resilience.
# - Named volumes for all persistent data.
# - Log rotation via max-size / max-file.

services:
  caddy:
    image: docker.io/library/caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      NOOMBAT_DOMAIN: ${NOOMBAT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - noombat
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  noombat:
    restart: unless-stopped
    ports: [] # Caddy handles external traffic.
    expose:
      - "8443"
    environment:
      # Every value the production guard rails refuse to start without.
      # compose.yml supplies development defaults for these, and
      # `validate_production_config` treats those defaults as fatal once
      # NOOMBAT_DOMAIN is not localhost, so an override here is what makes
      # the stack bootable at all. Compose substitutes an unset host
      # variable with the empty string rather than omitting it, hence the
      # `:?` form: it fails at `compose up` with the variable's name
      # instead of at boot with a less obvious error.
      NOOMBAT_KEK: "${NOOMBAT_KEK:?generate one with openssl rand -hex 32}"
      NOOMBAT_JWT_SECRET: "${NOOMBAT_JWT_SECRET:?at least 32 bytes of randomness}"
      NOOMBAT_DATABASE_URL: "postgres://noombat:${POSTGRES_PASSWORD:?required}@db/noombat"
      NOOMBAT_MEILI_KEY: "${MEILI_MASTER_KEY:?required}"
      NOOMBAT_CHATMAIL_ADMIN_SECRET: "${CHATMAIL_ADMIN_SECRET:?required}"
      NOOMBAT_BOOTSTRAP_ADMIN: "${NOOMBAT_BOOTSTRAP_ADMIN:-}"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  db:
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  meilisearch:
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:?required}"
      # Production mode is selected here rather than in the base file,
      # so that the mode and the key it demands arrive together. It
      # rejects a key under 16 bytes and disables the search preview.
      #
      # It does NOT affect analytics. Those are gated solely on
      # MEILI_NO_ANALYTICS, which compose.yml sets and this overlay
      # inherits. Do not remove that flag on the assumption that this
      # mode covers it.
      MEILI_ENV: production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  chatmail:
    restart: unless-stopped
    environment:
      # Take the certificate Caddy obtained for chat.<domain> rather than
      # generating one. In production the entrypoint refuses to generate
      # anything, so without this the relay does not start, which is the
      # intended failure: a relay serving an untrusted chain looks
      # healthy and fails only at the client.
      CHATMAIL_CADDY_DATA: /caddy-data
    volumes:
      # Read-only: Caddy owns acquisition and renewal, the relay owns
      # importing the result and reloading the two daemons that serve it.
      - caddy-data:/caddy-data:ro
    depends_on:
      - caddy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  caddy-data:
  caddy-config:
