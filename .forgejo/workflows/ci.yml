# Forgejo Actions CI pipeline for Codeberg.
#
# Jobs `fmt` and `reuse` run on Codeberg's hosted runners
# (`codeberg-small`). They require no infrastructure and perform no
# Rust compilation.
#
# All other jobs run on a self-hosted runner registered with the label
# `ubuntu-latest`. They require Rust compilation, which exceeds the
# `codeberg-small` deadline on a cold cache. Jobs `integration` and
# `e2e` additionally use PostgreSQL and Redis service containers.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# ..... HOSTED RUNNER JOBS (no Rust compilation required) .....

jobs:
  fmt:
    name: Formatting
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable \
              --profile minimal --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check

  reuse:
    name: REUSE compliance
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install reuse
        run: pip install --break-system-packages reuse==6.2.0
      - run: reuse lint

  # ..... SELF-HOSTED RUNNER JOBS (Rust compilation required) .....

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache Cargo artefacts
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deny-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deny-
      - name: Install cargo-deny
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh \
            | bash
          cargo binstall --no-confirm cargo-deny@0.19.8
      - run: cargo deny check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable \
              --profile minimal --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache Cargo artefacts
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-clippy-
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Unit tests
    # Runs without a database. Tests that require PostgreSQL are
    # exercised in the `integration` job instead.
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache Cargo artefacts
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.94.0)
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.94.0 --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache Cargo artefacts
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-msrv-
      - run: cargo check --workspace

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: noombat
          POSTGRES_PASSWORD: noombat
          POSTGRES_DB: noombat
        options: >-
          --health-cmd "pg_isready -U noombat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: docker.io/library/redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOOMBAT_DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      NOOMBAT_DOMAIN: localhost
      NOOMBAT_PORT: "8443"
      NOOMBAT_ADMIN_TOKEN: ci-test-token
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo artefacts
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-integration-

      - name: Install sqlx-cli and run migrations
        run: |
          cargo install sqlx-cli@0.9.0 --locked --no-default-features \
            --features postgres,rustls
          sqlx migrate run --source migrations

      - name: Run all tests
        run: cargo test --workspace

  e2e:
    name: End-to-end tests (Firefox, Chromium, WebKit)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: "--shm-size=2g --ipc=host"
    services:
      postgres:
        image: docker.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: noombat
          POSTGRES_PASSWORD: noombat
          POSTGRES_DB: noombat
        options: >-
          --health-cmd "pg_isready -U noombat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: docker.io/library/redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOOMBAT_DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      NOOMBAT_DOMAIN: localhost
      NOOMBAT_PORT: "8443"
      NOOMBAT_ADMIN_TOKEN: ci-test-token
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install system build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential pkg-config postgresql-client

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo artefacts
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-e2e-

      - name: Install sqlx-cli and run migrations
        run: |
          cargo install sqlx-cli@0.9.0 --locked --no-default-features \
            --features postgres,rustls
          sqlx migrate run --source migrations

      - name: Build Noombat server
        run: cargo build --release --bin noombat

      - name: Build frontend assets
        working-directory: frontend
        run: |
          corepack enable
          pnpm install
          pnpm build

      - name: Seed test actor
        run: |
          PGPASSWORD=noombat psql -h postgres -U noombat -d noombat -c "
            INSERT INTO actors
              (actor_type, ap_id, username, domain, public_key_pem, is_local)
            VALUES
              ('individual', 'http://localhost:8443/users/testuser',
               'testuser', 'localhost',
               '-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0placeholder
          -----END PUBLIC KEY-----',
               TRUE)
            ON CONFLICT (ap_id) DO NOTHING;"

      - name: Start Noombat server
        run: |
          nohup ./target/release/noombat > /tmp/noombat.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8443/healthz; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Server failed to start within 60 seconds"
          cat /tmp/noombat.log
          exit 1

      - name: Install Playwright test dependencies
        working-directory: tests/e2e
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run Playwright tests (Firefox)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=firefox

      - name: Run Playwright tests (Chromium)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=chromium

      - name: Run Playwright tests (WebKit)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=webkit

      - name: Run Playwright tests (Firefox mobile viewport)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=firefox-mobile

      - name: Run Playwright tests (Chromium mobile viewport)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=chromium-mobile

      - name: Run Playwright tests (WebKit mobile viewport)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=webkit-mobile

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/noombat.log

      - name: Upload Playwright report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14
  interop:
    name: Federation interop (GotoSocial)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: noombat
          POSTGRES_PASSWORD: noombat
          POSTGRES_DB: noombat
        options: >-
          --health-cmd "pg_isready -U noombat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: docker.io/library/redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      gotosocial:
        image: docker.io/superseriousbusiness/gotosocial:latest
        env:
          GTS_HOST: gotosocial
          GTS_ACCOUNT_DOMAIN: gotosocial
          GTS_PROTOCOL: http
          GTS_PORT: "8080"
          GTS_TLS_MODE: ""
          GTS_DB_TYPE: sqlite
          GTS_DB_ADDRESS: /gotosocial/storage/sqlite.db
          GTS_STORAGE_LOCAL_BASE_PATH: /gotosocial/storage
          GTS_ACCOUNTS_REGISTRATION_OPEN: "false"
          GTS_LETSENCRYPT_ENABLED: "false"
        options: >-
          --health-cmd "wget -qO- http://localhost:8080/readyz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 15s
    env:
      NOOMBAT_DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      NOOMBAT_DOMAIN: localhost
      NOOMBAT_PORT: "8443"
      NOOMBAT_ADMIN_TOKEN: interop-test-token
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install system build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential pkg-config postgresql-client curl

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo artefacts
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-interop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-interop-

      - name: Install sqlx-cli and run migrations
        run: |
          cargo install sqlx-cli@0.9.0 --locked --no-default-features \
            --features postgres,rustls
          sqlx migrate run --source migrations

      - name: Build Noombat server
        run: cargo build --release --bin noombat

      - name: Build frontend assets
        working-directory: frontend
        run: |
          corepack enable
          pnpm install
          pnpm build

      - name: Seed test actor
        run: |
          PGPASSWORD=noombat psql -h postgres -U noombat -d noombat -c "
            INSERT INTO actors
              (actor_type, ap_id, username, domain, public_key_pem, is_local)
            VALUES
              ('individual', 'http://localhost:8443/users/alice',
               'alice', 'localhost',
               '-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAngu+UeqfsU3AJHhVHk2k
          MEjaIOzbOWRPu1TsqUpGq0IX/mhQUC6/mkF9+H27ziERaM+77JB7MQ9q1ITLnukj
          TlmQhgUrsstMV1ZiU+9WqJ+NmlpdoQ4zVFXEf7IJHmZ+mYxei/qhVrnBDvV4e1KR
          iOTxUYyqWrI7BFGrA3eR22zb9K5/CwOuTw0uYGGhkxfMalBXd4k1AyYGsHo/riQY
          xOCucw31jlUavoajo3CPXWXgCi+F6mumsIm7snaFNiCG8d8jqXZ8aSC8JcGImf95
          Gg3J3oGE9ZiAue0WmYC+oMDzLBJtqN0V/c1OsU7PsP8+8fllvlfBluhuTfR/O19J
          RQIDAQAB
          -----END PUBLIC KEY-----',
               TRUE)
            ON CONFLICT (ap_id) DO NOTHING;"

      - name: Start Noombat server
        run: |
          nohup ./target/release/noombat > /tmp/noombat.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8443/healthz; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Server failed to start within 60 seconds"
          cat /tmp/noombat.log
          exit 1

      - name: Run interop tests
        run: tests/interop/run.sh http://localhost:8443 http://gotosocial:8080

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/noombat.log
