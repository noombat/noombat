# Forgejo Actions CI pipeline for Codeberg.
#
# Jobs `fmt`, `clippy`, `deny`, `test`, and `msrv` run on Codeberg's
# hosted runners (`codeberg-small`). They require no infrastructure.
#
# Jobs `integration` and `e2e` run on a self-hosted runner registered
# with the label `ubuntu-latest`. They use PostgreSQL and Redis service
# containers and require Docker-in-Docker on the runner host.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# ..... HOSTED RUNNER JOBS (no database required) .....

jobs:
  fmt:
    name: Formatting
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo clippy --workspace -- -D warnings

  deny:
    name: Cargo Deny
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install Rust and cargo-deny
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable
          . "$HOME/.cargo/env"
          cargo install cargo-deny --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo deny check

  reuse:
    name: REUSE compliance
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install reuse
        run: pip install --break-system-packages reuse
      - run: reuse lint

  test:
    name: Unit tests
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache Cargo artefacts
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.88.0)
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install Rust 1.88.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.88.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo check --workspace

  # ..... SELF-HOSTED RUNNER JOBS .....

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: noombat
          POSTGRES_PASSWORD: noombat
          POSTGRES_DB: noombat
        options: >-
          --health-cmd "pg_isready -U noombat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: docker.io/library/redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOOMBAT_DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      NOOMBAT_DOMAIN: localhost
      NOOMBAT_PORT: "8443"
      NOOMBAT_ADMIN_TOKEN: ci-test-token
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo artefacts
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-integration-

      - name: Install sqlx-cli and run migrations
        run: |
          cargo install sqlx-cli --locked --no-default-features \
            --features postgres,rustls
          sqlx migrate run --source migrations

      - name: Run all tests
        run: cargo test --workspace

  e2e:
    name: End-to-end tests (Firefox, Chromium, WebKit)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: "--shm-size=2g --ipc=host"
    services:
      postgres:
        image: docker.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: noombat
          POSTGRES_PASSWORD: noombat
          POSTGRES_DB: noombat
        options: >-
          --health-cmd "pg_isready -U noombat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: docker.io/library/redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOOMBAT_DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      DATABASE_URL: postgres://noombat:noombat@postgres/noombat
      NOOMBAT_DOMAIN: localhost
      NOOMBAT_PORT: "8443"
      NOOMBAT_ADMIN_TOKEN: ci-test-token
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install system build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential pkg-config

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo artefacts
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-e2e-

      - name: Install sqlx-cli and run migrations
        run: |
          cargo install sqlx-cli --locked --no-default-features \
            --features postgres,rustls
          sqlx migrate run --source migrations

      - name: Build Noombat server
        run: cargo build --release --bin noombat

      - name: Seed test actor
        run: |
          PGPASSWORD=noombat psql -h postgres -U noombat -d noombat -c "
            INSERT INTO actors
              (actor_type, ap_id, username, domain, public_key_pem, is_local)
            VALUES
              ('individual', 'http://localhost:8443/users/testuser',
               'testuser', 'localhost',
               '-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0placeholder
          -----END PUBLIC KEY-----',
               TRUE)
            ON CONFLICT (ap_id) DO NOTHING;"

      - name: Start Noombat server
        run: |
          ./target/release/noombat &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8443/healthz && break
            sleep 2
          done

      - name: Install Playwright test dependencies
        working-directory: tests/e2e
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run Playwright tests (Firefox — primary)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=firefox

      - name: Run Playwright tests (Chromium)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=chromium

      - name: Run Playwright tests (WebKit)
        working-directory: tests/e2e
        run: pnpm exec playwright test --project=webkit

      - name: Upload Playwright report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14
