services:
  noombat:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NOOMBAT_DOMAIN: ${NOOMBAT_DOMAIN:-localhost}
      NOOMBAT_DATABASE_URL: postgres://noombat:noombat@db/noombat
      NOOMBAT_HOST: "0.0.0.0"
      NOOMBAT_PORT: "8443"
      NOOMBAT_REDIS_URL: redis://redis:6379
      NOOMBAT_MEILI_URL: http://meilisearch:7700
      NOOMBAT_MEILI_KEY: ${MEILI_MASTER_KEY:-noombat-dev-key}
      NOOMBAT_CHATMAIL_AVAILABLE: "true"
      NOOMBAT_CHATMAIL_DOMAIN: chat.${NOOMBAT_DOMAIN:-localhost}
      NOOMBAT_CHATMAIL_ADMIN_URL: http://chatmail:9100
      NOOMBAT_CHATMAIL_ADMIN_SECRET: ${CHATMAIL_ADMIN_SECRET:-noombat-chatmail-dev-secret}
    ports:
      - "8443:8443"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
      chatmail:
        condition: service_started

  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: noombat
      POSTGRES_PASSWORD: noombat
      POSTGRES_DB: noombat
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noombat"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  meilisearch:
    image: docker.io/getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-noombat-dev-key}
      # MEILI_ENV controls Meilisearch's runtime mode.
      # - "development": detailed error messages, no analytics,
      #   reduced security defaults. Suitable for local development.
      # - "production": requires MEILI_MASTER_KEY to be set
      #   explicitly, enforces HTTPS for the dashboard, and enables
      #   optimised resource usage. Override this to "production"
      #   for any internet-facing deployment:
      #
      #     MEILI_ENV: production
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data

  chatmail:
    build:
      context: .
      dockerfile: Dockerfile.chatmail
    hostname: chat.${NOOMBAT_DOMAIN:-localhost}
    environment:
      MAIL_DOMAIN: chat.${NOOMBAT_DOMAIN:-localhost}
      CHATMAIL_ADMIN_SECRET: ${CHATMAIL_ADMIN_SECRET:-noombat-chatmail-dev-secret}
      CHATMAIL_ADMIN_HOST: "0.0.0.0"
      CHATMAIL_ADMIN_PORT: "9100"
      CHATMAIL_ALLOWLIST_URL: ${CHATMAIL_ALLOWLIST_URL:-https://noombat.org/chatmail-allowlist.json}
    ports:
      - "25:25"       # inbound SMTP (MX)
      - "993:993"     # IMAP (TLS)
      - "465:465"     # SMTP submission (TLS)
    volumes:
      - chatmail-data:/home/vmail
    healthcheck:
      test: ["CMD", "doveadm", "service", "status", "imap"]
      interval: 30s
      timeout: 5s

volumes:
  pg-data:
  redis-data:
  meili-data:
  chatmail-data:
