services:
  noombat:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NOOMBAT_DOMAIN: ${NOOMBAT_DOMAIN:-localhost}
      NOOMBAT_DATABASE_URL: postgres://noombat:noombat@db/noombat
      NOOMBAT_HOST: "0.0.0.0"
      NOOMBAT_PORT: "8443"
      NOOMBAT_REDIS_URL: redis://redis:6379
      NOOMBAT_MEILI_URL: http://meilisearch:7700
      NOOMBAT_MEILI_KEY: ${MEILI_MASTER_KEY:-noombat-dev-key}
      NOOMBAT_CHATMAIL_AVAILABLE: "true"
      NOOMBAT_CHATMAIL_DOMAIN: chat.${NOOMBAT_DOMAIN:-localhost}
      NOOMBAT_CHATMAIL_ADMIN_URL: http://chatmail:9100
      NOOMBAT_CHATMAIL_ADMIN_SECRET: ${CHATMAIL_ADMIN_SECRET:-noombat-chatmail-dev-secret}
    ports:
      - "8443:8443"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
      chatmail:
        condition: service_started

  db:
    image: docker.io/library/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_USER: noombat
      POSTGRES_PASSWORD: noombat
      POSTGRES_DB: noombat
    volumes:
      # PostgreSQL 18 sets PGDATA to /var/lib/postgresql/18/docker and
      # declares VOLUME /var/lib/postgresql. Mounting the old
      # /var/lib/postgresql/data makes the entrypoint refuse to start,
      # even on an empty volume.
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noombat"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: docker.io/library/redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    volumes:
      - redis-data:/data

  meilisearch:
    image: docker.io/getmeili/meilisearch:v1.52@sha256:4b97a53f5a64a5f0228da6d1db2fde016695d287aecb11a83bca368148542f7e
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-noombat-dev-key}
      # Development by default, production selected by compose.prod.yml,
      # which is also where the master key becomes mandatory.
      #
      # This file used to default to production, which did not start:
      # production mode requires a key of at least 16 bytes and the
      # default above is 15, so `docker compose up -d` exited 1 on the
      # documented quickstart. Lengthening the default would have fixed
      # the symptom and left a publicly known key running in a mode
      # whose whole purpose is to demand a secret one.
      MEILI_ENV: development
      # Meilisearch reports anonymised usage to its vendor in EVERY
      # mode unless this is set, which a self-hosted instance of a
      # privacy-oriented network should not do by default. The CI
      # integration job already sets it; no compose file did.
      #
      # Not conditional on MEILI_ENV: analytics/mod.rs branches only on
      # `opt.no_analytics`, and `Opt::analytics` is `!self.no_analytics`
      # (meilisearch v1.52.0). MEILI_ENV is reported as a field, never
      # consulted as a gate.
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data

  chatmail:
    build:
      context: .
      dockerfile: Dockerfile.chatmail
    hostname: chat.${NOOMBAT_DOMAIN:-localhost}
    environment:
      MAIL_DOMAIN: chat.${NOOMBAT_DOMAIN:-localhost}
      CHATMAIL_ADMIN_SECRET: ${CHATMAIL_ADMIN_SECRET:-noombat-chatmail-dev-secret}
      CHATMAIL_ADMIN_HOST: "0.0.0.0"
      CHATMAIL_ADMIN_PORT: "9100"
      # Empty by default. Set it to join the closed federation, which
      # is also the point at which this relay begins contacting a third
      # party on a timer. See .env.example.
      CHATMAIL_ALLOWLIST_URL: ${CHATMAIL_ALLOWLIST_URL:-}
    ports:
      - "25:25"       # inbound SMTP (MX)
      - "993:993"     # IMAP (TLS)
      - "465:465"     # SMTP submission (TLS)
    volumes:
      - chatmail-data:/home/vmail
    healthcheck:
      test: ["CMD", "doveadm", "service", "status", "imap"]
      interval: 30s
      timeout: 5s

volumes:
  pg-data:
  redis-data:
  meili-data:
  chatmail-data:
