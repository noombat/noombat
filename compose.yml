services:
  noombat:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NOOMBAT_DOMAIN: ${NOOMBAT_DOMAIN:-localhost}
      NOOMBAT_DATABASE_URL: postgres://noombat:noombat@db/noombat
      NOOMBAT_HOST: "0.0.0.0"
      NOOMBAT_PORT: "8443"
      NOOMBAT_REDIS_URL: redis://redis:6379
      NOOMBAT_MEILI_URL: http://meilisearch:7700
      NOOMBAT_MEILI_KEY: ${MEILI_MASTER_KEY:-noombat-dev-key}
      NOOMBAT_CHATMAIL_AVAILABLE: "true"
      NOOMBAT_CHATMAIL_DOMAIN: chat.${NOOMBAT_DOMAIN:-localhost}
      NOOMBAT_CHATMAIL_ADMIN_URL: http://chatmail:9100
      NOOMBAT_CHATMAIL_ADMIN_SECRET: ${CHATMAIL_ADMIN_SECRET:-noombat-chatmail-dev-secret}
      # The instance's administrative contact. Caddy passes the same
      # variable to Let's Encrypt as the ACME account address, so the
      # address a reader is told to write to and the address a certificate
      # warning is sent to cannot drift apart.
      NOOMBAT_CONTACT_EMAIL: ${NOOMBAT_CONTACT_EMAIL:-}
      # Trust the relay's development CA in addition to the public roots.
      #
      # NOOMBAT_EXTRA_CA_FILE and not SSL_CERT_FILE: the latter replaces
      # the trust store rather than extending it, and it governs
      # federation too, so pointing it at a private relay CA would stop
      # this instance trusting every public CA at the same instant.
      #
      # Without this the default stack cannot complete a handshake with
      # its own relay: provisioning fails, actors.chatmail_addr stays
      # NULL, and the only trace is one server log line.
      NOOMBAT_EXTRA_CA_FILE: /etc/ssl/chatmail-ca/ca.crt
    ports:
      - "8443:8443"
    volumes:
      - chatmail-ca:/etc/ssl/chatmail-ca:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
      chatmail:
        condition: service_started

  db:
    image: docker.io/library/postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: noombat
      POSTGRES_PASSWORD: noombat
      POSTGRES_DB: noombat
    volumes:
      # PostgreSQL 18 sets PGDATA to /var/lib/postgresql/18/docker and
      # declares VOLUME /var/lib/postgresql. Mounting the old
      # /var/lib/postgresql/data makes the entrypoint refuse to start,
      # even on an empty volume.
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noombat"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: docker.io/library/redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    volumes:
      - redis-data:/data
    # Present so that `docker compose up --wait` actually waits. A service
    # with no healthcheck is "ready" the moment it is running, which is
    # not the same thing, and CI now gates on this instead of on the
    # equivalent `--health-cmd` it used to repeat in ci.yml.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: docker.io/getmeili/meilisearch:v1.53@sha256:8d6643d86d71fad6ad3cba92cde7ccfce9e4d6c384bda67598eb553571c32431
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-noombat-dev-key}
      # Development by default, production selected by compose.prod.yml,
      # which is also where the master key becomes mandatory.
      #
      # This file used to default to production, which did not start:
      # production mode requires a key of at least 16 bytes and the
      # default above is 15, so `docker compose up -d` exited 1 on the
      # documented quickstart. Lengthening the default would have fixed
      # the symptom and left a publicly known key running in a mode
      # whose whole purpose is to demand a secret one.
      MEILI_ENV: development
      # Meilisearch reports anonymised usage to its vendor in EVERY
      # mode unless this is set, which a self-hosted instance of a
      # privacy-oriented network should not do by default. The CI
      # integration job already sets it; no compose file did.
      #
      # Not conditional on MEILI_ENV: analytics/mod.rs branches only on
      # `opt.no_analytics`, and `Opt::analytics` is `!self.no_analytics`.
      # MEILI_ENV is reported as a field, never consulted as a gate.
      # Read in the meilisearch source at v1.52.0, which is the version
      # the claim was checked against rather than the one pinned above;
      # re-check it if this setting ever appears not to take effect.
      MEILI_NO_ANALYTICS: "true"
    # See the note on redis. `/health` is unauthenticated, which is why it
    # works here without the master key.
    #
    # 127.0.0.1 rather than localhost, deliberately. Meilisearch binds
    # 0.0.0.0:7700 on IPv4 only, while `localhost` inside this image
    # resolves to ::1 first, so the localhost form fails with "connection
    # refused" and the container never becomes healthy. Verified by
    # running both forms inside the container.
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - meili-data:/meili_data

  chatmail:
    build:
      context: .
      dockerfile: Dockerfile.chatmail
    hostname: chat.${NOOMBAT_DOMAIN:-localhost}
    environment:
      MAIL_DOMAIN: chat.${NOOMBAT_DOMAIN:-localhost}
      CHATMAIL_ADMIN_SECRET: ${CHATMAIL_ADMIN_SECRET:-noombat-chatmail-dev-secret}
      CHATMAIL_ADMIN_HOST: "0.0.0.0"
      CHATMAIL_ADMIN_PORT: "9100"
      # Empty by default. Set it to join the closed federation, which
      # is also the point at which this relay begins contacting a third
      # party on a timer. See .env.example.
      CHATMAIL_ALLOWLIST_URL: ${CHATMAIL_ALLOWLIST_URL:-}
    ports:
      - "25:25"       # inbound SMTP (MX)
      - "993:993"     # IMAP (TLS)
      - "465:465"     # SMTP submission (TLS)
    volumes:
      - chatmail-data:/home/vmail
      # The certificate and its key on a volume, not on the container
      # filesystem. Written there they are regenerated on every
      # `compose up --build` and on every recreate, so a client that
      # pinned the chain breaks for a reason nothing reports, and a
      # renewed certificate is thrown away by the next deployment.
      - chatmail-tls:/etc/ssl/certs
      - chatmail-tls-key:/etc/ssl/private
      # The development CA, shared with Noombat so it can complete a
      # handshake against this relay. Read-only there, since only this
      # container issues it.
      - chatmail-ca:/etc/ssl/chatmail-ca
      # The DKIM signing key. On the container filesystem it is
      # regenerated on every recreate, against a TXT record the operator
      # already published, so the relay would start signing with a key
      # the world cannot verify. Receiving relays treat a signature that
      # fails verification worse than no signature at all, so losing the
      # key turns a silent problem into an active one.
      #
      # Not shared with the application container: nothing outside this
      # one needs to sign, and a private key reachable from the web
      # process is a key with a much larger attack surface.
      - chatmail-dkim:/etc/opendkim
    healthcheck:
      test: ["CMD", "doveadm", "service", "status", "imap"]
      interval: 30s
      timeout: 5s

volumes:
  pg-data:
  redis-data:
  meili-data:
  chatmail-data:
  chatmail-tls:
  chatmail-tls-key:
  chatmail-ca:
  chatmail-dkim:
