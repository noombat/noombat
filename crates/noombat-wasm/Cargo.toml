[package]
name = "noombat-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM bridge: exposes noombat-autocrypt and blob encryption to the browser via wasm-bindgen."

[lib]
crate-type = ["cdylib"]

[dependencies]
noombat-autocrypt = { workspace = true }
pgp = { workspace = true }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
base64 = { workspace = true }
smallvec = "1"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
