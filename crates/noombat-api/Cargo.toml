[package]
name = "noombat-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Axum routes, server-side HTML Askama templates, and internationalisation."

[dependencies]
noombat-core = { workspace = true }
noombat-ap = { workspace = true }
noombat-chat = { workspace = true }
noombat-federation = { workspace = true }
noombat-identity = { workspace = true }
noombat-jobs = { workspace = true }
noombat-markup = { workspace = true }
async-trait = { workspace = true }
askama = { workspace = true }
askama_web = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
rust-i18n = { workspace = true }
subtle = { workspace = true }
redis = { workspace = true }
http-signature-normalization = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
urlencoding = { workspace = true }
zip = { workspace = true }
ammonia = { workspace = true }
governor = { workspace = true }
hmac = { workspace = true }

[dev-dependencies]
# `ServiceExt::oneshot` drives the assembled Router in integration
# tests without binding a socket.
tower = { version = "0.5", features = ["util"] }
