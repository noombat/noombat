{% for post in posts %}
<article aria-label="{{ post.aria_label }}">
    <header>
        <a href="/users/{{ post.author }}">{{ post.author_display }}</a>
        <time datetime="{{ post.created_at }}">{{ post.created_at }}</time>
    </header>
    <div>{{ post.content_html|safe }}</div>
    <footer>
        <a href="/posts/{{ post.ap_id }}">{{ permalink_label }}</a>
    </footer>
</article>
{% endfor %}
{% if has_next %}
<div hx-get="/feed?page={{ next_page }}"
     hx-trigger="revealed"
     hx-swap="outerHTML">
    <span class="htmx-indicator" aria-live="polite">{{ loading_more_label }}</span>
</div>
{% endif %}
