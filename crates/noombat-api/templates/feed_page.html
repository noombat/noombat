{% for post in posts %}
<article aria-label="{{ post.aria_label }}"
         class="border-b border-border py-4">
    <header class="flex items-baseline gap-2 mb-1">
        <a href="/users/{{ post.author }}"
           class="text-accent font-semibold no-underline hover:underline">
            {{ post.author_display }}
        </a>
        <time datetime="{{ post.created_at }}"
              class="text-muted text-xs">
            {{ post.created_at }}
        </time>
    </header>
    <div class="leading-relaxed">{{ post.content_html|safe }}</div>
    <footer class="mt-2">
        <a href="/users/{{ post.author }}/posts/{{ post.post_id }}"
           class="text-muted text-xs no-underline hover:underline">
            {{ permalink_label }}
        </a>
    </footer>
</article>
{% endfor %}
{% if has_next %}
<div hx-get="/feed?page={{ next_page }}"
     hx-trigger="revealed"
     hx-swap="outerHTML"
     class="py-4">
    <span class="htmx-indicator text-muted text-sm" aria-live="polite">
        {{ loading_more_label }}
    </span>
</div>
{% endif %}
