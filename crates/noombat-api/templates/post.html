{% extends "base.html" %}

{% block title %}{{ page_title }} — {{ i18n.t("nav_brand") }}{% endblock %}

{% block content %}
        <article aria-label="{{ aria_post_label }}">
            <header class="flex items-baseline gap-2 mb-2">
                <a href="/users/{{ author }}"
                   class="text-accent font-semibold no-underline hover:underline">
                    {{ author_display }}
                </a>
                <time datetime="{{ created_at }}"
                      class="text-muted text-xs">
                    {{ created_at }}
                </time>
            </header>
            <div class="leading-relaxed">{{ content_html|safe }}</div>
            <footer class="mt-3 flex gap-3 text-xs text-muted">
                <button type="button"
                        class="hover:text-fg"
                        onclick="this.nextElementSibling.toggleAttribute('hidden')"
                        aria-expanded="false"
                        aria-controls="report-form-{{ post_id }}">
                    {{ i18n.t("report_action") }}
                </button>
                <form id="report-form-{{ post_id }}" hidden
                      hx-post="/api/v1/reports"
                      hx-swap="outerHTML"
                      class="border border-border rounded p-3 mt-2 space-y-2 text-sm text-fg">
                    <input type="hidden" name="target_post_id" value="{{ post_id }}">
                    <label class="block">
                        {{ i18n.t("report_reason") }}
                        <select name="reason" class="block border border-border rounded px-2 py-1 bg-surface text-fg text-sm mt-1">
                            <option value="spam">{{ i18n.t("report_reason_spam") }}</option>
                            <option value="harassment">{{ i18n.t("report_reason_harassment") }}</option>
                            <option value="illegal">{{ i18n.t("report_reason_illegal") }}</option>
                            <option value="impersonation">{{ i18n.t("report_reason_impersonation") }}</option>
                            <option value="other">{{ i18n.t("report_reason_other") }}</option>
                        </select>
                    </label>
                    <label class="block">
                        {{ i18n.t("report_comment") }}
                        <textarea name="comment" rows="2"
                                  class="block w-full border border-border rounded px-2 py-1 bg-surface text-fg text-sm mt-1"></textarea>
                    </label>
                    <button type="submit" class="bg-accent text-white rounded px-3 py-1 text-sm hover:opacity-90">
                        {{ i18n.t("report_submit") }}
                    </button>
                </form>
            </footer>
        </article>
{% endblock %}
