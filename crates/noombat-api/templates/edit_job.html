{% block title %}{{ i18n.t("edit_job_title") }}{% endblock %}

{% block content %}
        <h1 class="text-2xl font-bold mb-6">{{ i18n.t("edit_job_title") }}</h1>

        <form hx-post="/users/{{ username }}/jobs"
              hx-swap="none"
              class="space-y-4 max-w-lg">

            <div>
                <label for="job-title" class="block text-sm mb-1">{{ i18n.t("job_title_label") }}</label>
                <input id="job-title" name="title" type="text" required
                       class="w-full border border-border-default rounded px-3 py-2 bg-bg-raised text-text-primary">
            </div>

            <div>
                <label for="job-desc" class="block text-sm mb-1">{{ i18n.t("job_description") }}</label>
                <textarea id="job-desc" name="description_md" rows="8" required
                          class="w-full border border-border-default rounded p-3 font-mono text-sm bg-bg-raised text-text-primary"></textarea>
            </div>

            <div>
                <label for="job-loc" class="block text-sm mb-1">{{ i18n.t("job_location") }}</label>
                <input id="job-loc" name="location" type="text"
                       class="w-full border border-border-default rounded px-3 py-2 bg-bg-raised text-text-primary">
            </div>

            <div class="flex items-center gap-2">
                <input id="job-remote" name="remote" type="checkbox" value="true"
                       class="rounded border-border-default">
                <label for="job-remote" class="text-sm">{{ i18n.t("job_remote") }}</label>
            </div>

            <div class="flex gap-4">
                <div class="flex-1">
                    <label for="job-sal-min" class="block text-sm mb-1">{{ i18n.t("job_salary_min") }}</label>
                    <input id="job-sal-min" name="salary_min" type="number"
                           class="w-full border border-border-default rounded px-3 py-2 bg-bg-raised text-text-primary">
                </div>
                <div class="flex-1">
                    <label for="job-sal-max" class="block text-sm mb-1">{{ i18n.t("job_salary_max") }}</label>
                    <input id="job-sal-max" name="salary_max" type="number"
                           class="w-full border border-border-default rounded px-3 py-2 bg-bg-raised text-text-primary">
                </div>
                <div class="w-24">
                    <label for="job-currency" class="block text-sm mb-1">{{ i18n.t("job_currency") }}</label>
                    <input id="job-currency" name="currency" type="text" maxlength="3" placeholder="USD"
                           class="w-full border border-border-default rounded px-3 py-2 bg-bg-raised text-text-primary font-mono">
                </div>
            </div>

            <button type="submit"
                    class="bg-bg-brand text-text-on-brand rounded px-6 py-2 hover:opacity-90">
                {{ i18n.t("job_publish") }}
            </button>
        </form>
{% endblock %}
