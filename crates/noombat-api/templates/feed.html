{% block title %}{{ i18n.t("feed_title") }} - {{ i18n.t("nav_brand") }}{% endblock %}

{% block content %}
        <h1 class="text-2xl font-bold mb-6">{{ i18n.t("feed_heading") }}</h1>
        <div id="feed-items"
             hx-get="{{ feed_url }}"
             hx-trigger="load"
             hx-swap="innerHTML"
             hx-indicator="#feed-loading">
            <span id="feed-loading" class="htmx-indicator text-text-secondary text-sm">
                {{ i18n.t("feed_loading") }}
            </span>
        </div>
{% endblock %}
