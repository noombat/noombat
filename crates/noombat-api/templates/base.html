<!DOCTYPE html>
<html lang="{{ i18n.lang_attr() }}" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Noombat{% endblock %}</title>
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="/assets/main.css">
    <script src="/assets/htmx.js"></script>
    {% block style %}{% endblock %}
</head>
<body class="bg-bg text-fg font-sans leading-relaxed">
    <a class="skip-link" href="#main-content">{{ i18n.t("skip_to_content") }}</a>
    <nav aria-label="{{ i18n.t("aria_nav_main") }}"
         class="border-b border-border px-4 py-3 flex items-center gap-4">
        <a href="/"
           class="text-accent no-underline hover:underline">
            {{ i18n.t("nav_brand") }}
        </a>
        <span class="flex-1"></span>
        {% block nav_links %}
        <a href="/auth/login"
           class="text-sm text-muted no-underline hover:text-fg">
            {{ i18n.t("auth_login_title") }}
        </a>
        {% endblock %}
    </nav>
    <main id="main-content" role="main"
          class="max-w-2xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
