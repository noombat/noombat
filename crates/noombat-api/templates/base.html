<!DOCTYPE html>
<!--
  Localised client-side strings are carried on the root element as
  data-* attributes. Scripts read them via `document.documentElement.dataset`,
  which keeps translated text out of inline <script> bodies and so out of
  conflict with a `script-src 'self'` Content-Security-Policy.
-->
<html lang="{{ i18n.lang_attr() }}" dir="ltr"
      data-theme="{{ theme.as_str() }}"
      data-password-mismatch="{{ i18n.t("auth_password_mismatch") }}"
      data-network-error="{{ i18n.t("error_network") }}"
      data-upgrade-password-failed="{{ i18n.t("auth_upgrade_password_failed") }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--
      HTMX injects a <style> element for its request-indicator classes
      during initialisation. A `style-src 'self'` policy without
      'unsafe-inline' blocks it, which raised a securitypolicyviolation
      on every page load. Disabling the injection here rather than in
      htmx.ts is necessary: htmx reads this meta element while
      initialising, before a deferred module script could set the option.
      The equivalent rules live in frontend/src/main.css.
    -->
    <meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
    <title>{% block title %}Noombat{% endblock %}</title>
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="/assets/main.css">
    <script type="module" src="/assets/htmx.js"></script>
    {% block style %}{% endblock %}
</head>
<body class="bg-bg text-fg font-sans leading-relaxed">
    <a class="skip-link" href="#main-content">{{ i18n.t("skip_to_content") }}</a>

    <!--
      Announcement region for assistive technology.
      
      A live region only announces reliably when it is already present and
      exposed and its text content then changes. Marking a hidden
      indicator aria-live does not work: `display: none` removes the
      element from the accessibility tree, so revealing it inserts a
      region that was never being observed, and screen readers handle
      that inconsistently. This region is therefore always present, never
      hidden from assistive technology, and empty until something updates
      its text.
      
      Updated by out-of-band swap; see feed_page.html. `role="status"`
      implies aria-live="polite" and aria-atomic="true".
      
      Kept outside <main> so a content swap cannot replace it: replacing
      the node would reintroduce the very problem it solves.
    -->
    <div id="a11y-status" class="sr-only" role="status"></div>
    <nav aria-label="{{ i18n.t("aria_nav_main") }}"
         class="border-b border-border px-4 py-3 flex items-center gap-4">
        <a href="/"
           class="text-accent no-underline hover:underline">
            {{ i18n.t("nav_brand") }}
        </a>
        <span class="flex-1"></span>
        {% block nav_links %}
        <a href="/auth/login"
           class="text-sm text-muted no-underline hover:text-fg">
            {{ i18n.t("auth_login_title") }}
        </a>
        {% endblock %}
        <!--
          Theme control. A form, so it works with no script at all: the
          server records the choice and redirects back.

          These are three states of one setting and exactly one is on,
          which is aria-pressed rather than aria-current.
        -->
        <form method="post" action="/settings/theme"
              class="flex items-center gap-2"
              aria-label="{{ i18n.t("theme_group_label") }}">
            <button type="submit" name="theme" value="light"
                    aria-pressed="{% if theme.as_str() == "light" %}true{% else %}false{% endif %}"
                    class="text-sm text-muted hover:text-fg aria-pressed:text-fg">
                {{ i18n.t("theme_light") }}
            </button>
            <button type="submit" name="theme" value="dark"
                    aria-pressed="{% if theme.as_str() == "dark" %}true{% else %}false{% endif %}"
                    class="text-sm text-muted hover:text-fg aria-pressed:text-fg">
                {{ i18n.t("theme_dark") }}
            </button>
            <button type="submit" name="theme" value="system"
                    aria-pressed="{% if theme.as_str() == "system" %}true{% else %}false{% endif %}"
                    class="text-sm text-muted hover:text-fg aria-pressed:text-fg">
                {{ i18n.t("theme_system") }}
            </button>
        </form>
    </nav>
    <main id="main-content" role="main"
          class="max-w-2xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
