<!DOCTYPE html>
<html lang="{{ i18n.lang_attr() }}" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Noombat{% endblock %}</title>
    {% block head %}{% endblock %}
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <style>
        :root {
            --color-bg: #fafafa;
            --color-fg: #1a1a1a;
            --color-muted: #666;
            --color-accent: #4a6fa5;
            --color-focus: #2563eb;
            --color-surface: #ffffff;
            --color-border: #e0e0e0;
            --font-sans: system-ui, -apple-system, sans-serif;
            --max-width: 42rem;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --color-bg: #1a1a1a;
                --color-fg: #e0e0e0;
                --color-muted: #999;
                --color-accent: #7ba4d4;
                --color-focus: #60a5fa;
                --color-surface: #2a2a2a;
                --color-border: #444;
            }
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: var(--font-sans);
            background: var(--color-bg);
            color: var(--color-fg);
            line-height: 1.6;
        }
        :focus-visible {
            outline: 2px solid var(--color-focus);
            outline-offset: 2px;
        }
        a:focus-visible {
            border-radius: 2px;
        }
        .skip-link {
            position: absolute;
            top: -100%;
            left: 1rem;
            padding: 0.5rem 1rem;
            background: var(--color-accent);
            color: #fff;
            text-decoration: none;
            z-index: 100;
            border-radius: 0 0 4px 4px;
        }
        .skip-link:focus {
            top: 0;
        }
        nav[aria-label] {
            border-bottom: 1px solid var(--color-border);
            padding: 0.75rem 1rem;
        }
        nav[aria-label] a {
            color: var(--color-accent);
            text-decoration: none;
            margin-right: 1rem;
        }
        nav[aria-label] a:hover {
            text-decoration: underline;
        }
        main {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
    </style>
    {% block style %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main-content">{{ i18n.t("skip_to_content") }}</a>
    <nav aria-label="{{ i18n.t("aria_nav_main") }}">
        <a href="/">{{ i18n.t("nav_brand") }}</a>
    </nav>
    <main id="main-content" role="main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
