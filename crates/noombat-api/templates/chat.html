{% extends "base_auth.html" %}

{% block title %}{{ i18n.t("chat_title") }}{% endblock %}

{% block content %}
        {% if chat_suspended %}
        <!-- Chat has been suspended by a moderator. The island is not
             mounted; display a static message instead. -->
        <div class="max-w-md mx-auto py-12 text-center">
            <h2 class="text-lg font-semibold mb-4">{{ i18n.t("chat_title") }}</h2>
            <p class="text-sm text-red-600 mb-6">
                {{ i18n.t("chat_suspended") }}
            </p>
        </div>
        {% else %}
        <!-- The SolidJS chat island mounts here. data-* attributes
             carry the initial state needed by the island. -->
        <div id="chat-mount"
             data-ws-url="{{ ws_url }}"
             data-chatmail-addr="{{ chatmail_addr }}"
             data-username="{{ username }}"
             data-locale="{{ i18n.lang_attr() }}"
             aria-label="{{ i18n.t("aria_chat") }}">
            <!-- Fallback content for no-JS or while the island loads. -->
            <p class="text-muted">{{ i18n.t("chat_empty") }}</p>
        </div>
        {% endif %}
{% endblock %}

{% block style %}
<script type="module" src="/assets/chat.js"></script>
{% endblock %}
