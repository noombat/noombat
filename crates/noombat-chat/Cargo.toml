[package]
name = "noombat-chat"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "IMAP/SMTP ciphertext relay for Chatmail (WebSocket to Chatmail bridge)."

[dependencies]
noombat-core = { workspace = true }
async-imap = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
# `std` for `PemObject::pem_file_iter`, which reads NOOMBAT_EXTRA_CA_FILE.
# Declared rather than relied on from another crate's unification.
rustls-pki-types = { workspace = true, features = ["std"] }
webpki-roots = { workspace = true }
rustls-native-certs = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
lettre = { workspace = true }
mailparse = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
futures-lite = "2"

[dev-dependencies]
tempfile = { workspace = true }
