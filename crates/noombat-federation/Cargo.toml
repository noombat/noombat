[package]
name = "noombat-federation"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ActivityPub S2S federation: inbox, outbox, delivery, WebFinger, NodeInfo, and HTTP Signature verification."

[dependencies]
noombat-core = { workspace = true }
noombat-ap = { workspace = true }
noombat-identity = { workspace = true }
noombat-markup = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
rsa = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
# Only the reqwest wrapper is used here, for outbound signing in
# `signed_fetch` and `delivery`. The base http-signature-normalization crate
# is not declared: it is a direct dependency of noombat-api, which uses its
# `Config` to verify inbound signatures. Declaring it here as well bought
# nothing, because the wrapper already carries it.
http-signature-normalization-reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
bs58 = { workspace = true }
serde_json_canonicalizer = { workspace = true }

[dev-dependencies]
# Building a `reqwest::Response` without a server, for the body-limit test.
http = { workspace = true }
