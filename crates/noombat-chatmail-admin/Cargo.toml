[package]
name = "noombat-chatmail-admin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Chatmail relay administration sidecar daemon and filtermail content filter."

[[bin]]
name = "noombat-chatmail-admin"
path = "src/main.rs"

[[bin]]
name = "noombat-filtermail"
path = "src/filtermail.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tiny_http = { workspace = true }
ureq = { workspace = true }
subtle = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
mailparse = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
