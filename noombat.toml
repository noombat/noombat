# Local development configuration.
# Environment variables prefixed NOOMBAT_ take precedence.

domain = "localhost"
database_url = "postgres://noombat:noombat@localhost/noombat"
host = "0.0.0.0"
port = 8443
max_connections = 5
open_registrations = true

# Development-only bearer token for C2S outbox POST!.
# Set to enable POST /users/{username}/outbox. Omit to disable.
admin_token = "noombat"

# Redis connection URL (optional; enables rate limiting and session storage).
# redis_url = "redis://127.0.0.1:6379"

# JWT signing secret for session tokens (HS256, >= 32 bytes).
# Required for production; if unset, only the admin_token bearer is available.
# jwt_secret = "change-this-to-a-random-secret-at-least-32-bytes-long"

# Access-token lifetime in seconds (default: 900 = 15 min).
# access_ttl_secs = 900

# Refresh-token lifetime in seconds (default: 2592000 = 30 days).
# refresh_ttl_secs = 2592000

# ORCID OAuth credentials (obtain from https://orcid.org/developer-tools).
# orcid_client_id = "APP-XXXXXXXXXXXX"
# orcid_client_secret = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# Co-deployed Chatmail relay domain.
# Every instance co-deploys its own Chatmail relay and admin sidecar.
chatmail_domain = "chat.localhost"
chatmail_available = true

# Chat WebSocket idle timeout in seconds (default: 900 = 15 min).
# When the WebSocket session is idle for longer than this duration,
# the server closes the connection and clears the Chatmail password
# from memory.
chat_idle_timeout_secs = 900

# Chatmail admin sidecar REST API URL (internal-only).
# Required for suspension/unsuspension orchestration and
# chat moderation enforcement.
# chatmail_admin_url = "http://chatmail:9100"

# Shared secret for authenticating requests to the admin sidecar.
# Must match the CHATMAIL_ADMIN_SECRET environment variable set on
# the noombat-chatmail container.
# chatmail_admin_secret = "change-this-to-a-random-secret"

# Whether eddsa-jcs-2022 integrity proofs are attached to all
# outbound ActivityPub activities (default: true).
integrity_proofs_enabled = true

# Relay verification policy for inbound relay traffic.
# Values: "verify", "verify-or-fetch", "trust-relay".
# Uncomment to activate relay support.
# relay_verification_policy = "verify-or-fetch"
