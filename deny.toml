# cargo-deny configuration (cargo-deny 0.19.x, v2 schema)
# https://embarkstudios.github.io/cargo-deny/
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
# Run: cargo deny check

[advisories]
# `vulnerability` and `notice` always emit errors and are not configurable.
# `unmaintained` (default: all) and `unsound` (default: workspace) control
# which crates are checked; Values: "all", "workspace", "transitive", "none".
unmaintained = "all"
unsound = "workspace"
yanked = "warn"

[licenses]
# All licenses are denied unless explicitly listed here.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
