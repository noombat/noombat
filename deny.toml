# cargo-deny configuration (v2 schema)
# https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny check

[advisories]
version = 2
# Scope: which crates to check. All matches are treated as errors.
# Values: "all" (v1 "deny", check all crates), "workspace" (v1 "warn", check direct dependencies only), "transitive", "none"
vulnerability = "all"
unmaintained = "workspace"
yanked = "workspace"
notice = "workspace"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
