# cargo-deny configuration, v2 schema.
#
# Verified against 0.20.2. cargo-deny 0.18.6 rejects the `unsound` key
# below outright, so which version runs matters, and CI does not pin one.
# https://embarkstudios.github.io/cargo-deny/
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
# Run: cargo deny check

[advisories]
# `vulnerability` and `notice` always emit errors and are not configurable.
# `unmaintained` (default: all) and `unsound` (default: workspace) control
# which crates are checked; Values: "all", "workspace", "transitive", "none".
unmaintained = "all"
unsound = "workspace"
yanked = "warn"
ignore = [
    # Marvin Attack (RSA timing side-channel). No patched version available.
    # https://rustsec.org/advisories/RUSTSEC-2023-0071
    "RUSTSEC-2023-0071",
]

[licenses]
# All licenses are denied unless explicitly listed here.
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
unused-allowed-license = "allow"

# The http-signature-normalization crates declare their licence using the
# deprecated SPDX identifier "AGPL-3.0" (without the suffix).
[[licenses.exceptions]]
allow = ["AGPL-3.0"]
crate = "http-signature-normalization"

[[licenses.exceptions]]
allow = ["AGPL-3.0"]
crate = "http-signature-normalization-reqwest"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
