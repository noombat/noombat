[workspace]
resolver = "2"
members = [
    "crates/noombat-core",
    "crates/noombat-ap",
    "crates/noombat-markup",
    "crates/noombat-federation",
    "crates/noombat-identity",
    "crates/noombat-jobs",
    "crates/noombat-groups",
    "crates/noombat-events",
    "crates/noombat-chat",
    "crates/noombat-chatmail-admin",
    "crates/noombat-api",
    "crates/noombat-server",
]

[workspace.package]
edition = "2024"
rust-version = "1.94.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/noombat/noombat"

[workspace.dependencies]
# Internal crates.
noombat-core = { path = "crates/noombat-core", version = "0.1.0" }
noombat-ap = { path = "crates/noombat-ap", version = "0.1.0" }
noombat-markup = { path = "crates/noombat-markup", version = "0.1.0" }
noombat-federation = { path = "crates/noombat-federation", version = "0.1.0" }
noombat-identity = { path = "crates/noombat-identity", version = "0.1.0" }
noombat-jobs = { path = "crates/noombat-jobs", version = "0.1.0" }
noombat-groups = { path = "crates/noombat-groups", version = "0.1.0" }
noombat-events = { path = "crates/noombat-events", version = "0.1.0" }
noombat-chat = { path = "crates/noombat-chat", version = "0.1.0" }
noombat-api = { path = "crates/noombat-api", version = "0.1.0" }

# HTTP framework.
axum = { version = "0.8.9", features = ["macros", "ws"] }
tower-http = { version = "0.6.8", features = ["cors", "trace", "compression-gzip", "limit", "request-id", "fs"] }

# Async runtime.
tokio = { version = "1", features = ["full"] }

# Async trait methods (object-safe dyn-compatible desugaring).
async-trait = "0.1"

# Serialisation.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database.
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "migrate"] }

# Templates.
askama = "0.14"
askama_web = { version = "0.14", features = ["axum-0.8"] }

# Logging and tracing.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling.
thiserror = "2"
anyhow = "1"

# HTTP client.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }

# Cryptography.
rsa = { version = "0.9", features = ["sha2"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# HTTP Signatures.
http-signature-normalization = "0.7"
http-signature-normalization-reqwest = { version = "0.14", default-features = false, features = ["sha-2", "default-spawner"] }

# Types.
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Configuration.
dotenvy = "0.15"
figment = { version = "0.10", features = ["env", "toml"] }

# Internationalisation.
rust-i18n = "4"

# Markup pipeline.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
katex = { version = "0.4", default-features = true }
regex = "1"

# Search.
meilisearch-sdk = "0.28"

# Redis (session store, rate-limit counters).
redis = { version = "1.3", features = ["tokio-comp", "connection-manager"] }

# URL parsing (domain verification, DOI).
url = "2"

# URL percent-encoding/decoding (block endpoint path parameters).
urlencoding = "2"

# Temporary files (CV generation).
tempfile = "3"

# Constant-time comparison (admin token verification).
subtle = "2"

# Password hashing (Argon2id for auth_key_hash).
argon2 = "0.5"

# JWT (short-lived access tokens).
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# TOTP 2FA (RFC 6238).
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }

# QR code generation (TOTP enrolment).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# IMAP client (Chatmail relay).
# default-features = false to avoid the discontinued async-std (RUSTSEC-2025-0052);
# runtime-tokio aligns with the project's async runtime.
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }

# TLS connector for async-imap.
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "1"

# SMTP client (Chatmail relay, outbound encrypted messages).
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# MIME parsing (Autocrypt header extraction from IMAP messages).
mailparse = "0.15"

# WebSocket (chat relay: browser <--> server).
tokio-tungstenite = "0.26"

# Base58 encoding (Ed25519 multibase public keys, FEP-521a).
bs58 = "0.5"

# JSON Canonicalization Scheme (RFC 8785) for FEP-8b32 Object Integrity Proofs.
serde_json_canonicalizer = "0.3"

# HTML parsing (domain verification).
scraper = "0.27"

# Synchronous HTTP server (noombat-chatmail-admin sidecar).
tiny_http = "0.12"

# Synchronous HTTP client (noombat-chatmail-admin allowlist sync).
ureq = "3"

# ZIP archive creation (GDPR data export).
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev.package.sqlx-macros]
opt-level = 2

[profile.dev.package.num-bigint-dig]
opt-level = 3
