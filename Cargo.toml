[workspace]
resolver = "2"
members = [
    "crates/noombat-core",
    "crates/noombat-ap",
    "crates/noombat-markup",
    "crates/noombat-federation",
    "crates/noombat-identity",
    "crates/noombat-jobs",
    "crates/noombat-groups",
    "crates/noombat-events",
    "crates/noombat-chat",
    "crates/noombat-api",
    "crates/noombat-server",
]

[workspace.package]
edition = "2021"
rust-version = "1.94.0"
license = "AGPL-3.0-or-later"
repository = "https://codeberg.org/noombat/noombat"

[workspace.dependencies]
# Internal crates.
noombat-core = { path = "crates/noombat-core", version = "0.1.0" }
noombat-ap = { path = "crates/noombat-ap", version = "0.1.0" }
noombat-markup = { path = "crates/noombat-markup", version = "0.1.0" }
noombat-federation = { path = "crates/noombat-federation", version = "0.1.0" }
noombat-identity = { path = "crates/noombat-identity", version = "0.1.0" }
noombat-jobs = { path = "crates/noombat-jobs", version = "0.1.0" }
noombat-groups = { path = "crates/noombat-groups", version = "0.1.0" }
noombat-events = { path = "crates/noombat-events", version = "0.1.0" }
noombat-chat = { path = "crates/noombat-chat", version = "0.1.0" }
noombat-api = { path = "crates/noombat-api", version = "0.1.0" }

# HTTP framework.
axum = { version = "0.8.9", features = ["macros", "ws"] }
tower-http = { version = "0.6.8", features = ["cors", "trace", "compression-gzip", "limit", "request-id", "fs"] }

# Async runtime.
tokio = { version = "1", features = ["full"] }

# Serialisation.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database.
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "migrate"] }

# Templates.
askama = "0.14"
askama_web = { version = "0.14", features = ["axum-0.8"] }

# Logging and tracing.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling.
thiserror = "2"
anyhow = "1"

# HTTP client.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# Cryptography.
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# Types.
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Configuration.
dotenvy = "0.15"
figment = { version = "0.10", features = ["env", "toml"] }

# Internationalisation.
rust-i18n = "4"

# Authorisation.
cedar-policy = "4.11"

[profile.dev.package.sqlx-macros]
opt-level = 2

[profile.dev.package.num-bigint-dig]
opt-level = 3
