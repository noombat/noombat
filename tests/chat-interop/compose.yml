# Chat interoperability test environment.
#
# Spins up Noombat, the Chatmail relay container and PostgreSQL/Redis on
# a shared network. Tests verify:
#   1. The Chatmail admin sidecar is serving.
#   2. Account registration and login via the HTTP API.
#   3. Chat WebSocket route existence and chat report endpoint.
#   4. Auth page rendering.
#   5. Closed federation configuration.
#
# Usage:
#   1. docker compose -f tests/chat-interop/compose.yml up -d --build
#   2. tests/chat-interop/run.sh
#   3. docker compose -f tests/chat-interop/compose.yml down -v

services:
  # ..... DATABASES .....

  db:
    image: docker.io/library/postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: chatinterop
      POSTGRES_PASSWORD: chatinterop
      POSTGRES_DB: chatinterop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatinterop"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [chattest]

  redis:
    image: docker.io/library/redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    networks: [chattest]

  # ..... CHATMAIL RELAY .....
  #
  # Uses the project's noombat-chatmail container image, which
  # packages the standard Chatmail relay (Postfix + Dovecot +
  # doveauth + filtermail + OpenDKIM) alongside the
  # noombat-chatmail-admin sidecar daemon.

  chatmail:
    build:
      context: ../..
      dockerfile: Dockerfile.chatmail
    environment:
      MAIL_DOMAIN: chat.test.local
      CHATMAIL_ADMIN_SECRET: test-admin-secret
      CHATMAIL_ADMIN_HOST: "0.0.0.0"
      CHATMAIL_ADMIN_PORT: "9100"
      # Disable allowlist polling in the test environment.
      CHATMAIL_ALLOWLIST_URL: ""
    # Published so tests/chat-interop/run.sh, which runs on the host, can
    # assert the admin sidecar is actually serving.
    ports:
      - "9100:9100"
    # The entrypoint writes the CA it signs the relay certificate with
    # here, and Noombat mounts the same volume read-only to trust it.
    volumes:
      - chatmail-ca:/etc/ssl/chatmail-ca
    networks:
      chattest:
        aliases: [chat.test.local]

  # ..... NOOMBAT .....
  #
  # The domain is not `localhost`, so `validate_production_config` runs
  # in full and aborts the process on any documented default. Three of
  # the values below are what it demands: a JWT secret of at least 32
  # bytes, a database credential that is not `noombat:noombat`, and a
  # KEK. The Chatmail admin secret is checked against its own default
  # too. They are fixtures for a throwaway instance, not secrets.

  noombat:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      NOOMBAT_DOMAIN: test.local
      NOOMBAT_DATABASE_URL: postgres://chatinterop:chatinterop@db/chatinterop
      NOOMBAT_HOST: "0.0.0.0"
      NOOMBAT_PORT: "8443"
      NOOMBAT_REDIS_URL: redis://redis:6379
      NOOMBAT_JWT_SECRET: test-secret-at-least-32-bytes-long!!
      NOOMBAT_KEK: 0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
      NOOMBAT_CHATMAIL_DOMAIN: chat.test.local
      NOOMBAT_CHATMAIL_AVAILABLE: "true"
      NOOMBAT_CHATMAIL_ADMIN_URL: http://chatmail:9100
      NOOMBAT_CHATMAIL_ADMIN_SECRET: test-admin-secret
      # Provisioning speaks IMAP over TLS to the relay, whose certificate
      # is signed by the CA the chatmail container generates at boot, so
      # that CA is what has to be trusted. `rustls-native-certs` reads
      # this variable and the chat connector resolves its roots through
      # it, which is the same mechanism tests/interop/compose.yml uses to
      # trust Caddy's internal CA for federation.
      SSL_CERT_FILE: /chatmail-ca/ca.crt
    volumes:
      - chatmail-ca:/chatmail-ca:ro
    ports:
      - "8443:8443"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      # Healthy, not merely started: the CA has to exist before Noombat
      # builds its HTTP client, because `SSL_CERT_FILE` is read once at
      # startup and a path that is not there yet aborts the process with
      # "No CA certificates were loaded from the system". The container
      # reports healthy only once its entrypoint has finished, which is
      # after the certificate is written.
      chatmail: { condition: service_healthy }
    networks: [chattest]

volumes:
  # Carries the relay CA from the chatmail container to Noombat. Named
  # rather than a bind mount, because the file is generated at boot and
  # has no source on the host.
  chatmail-ca: {}

networks:
  chattest:
    driver: bridge
