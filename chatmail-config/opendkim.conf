#
# OpenDKIM configuration for the Noombat Chatmail relay.
#
# This file exists to override the Debian package's default, which is
# `Socket local:/run/opendkim/opendkim.sock`. Postfix here dials
# `inet:127.0.0.1:8891` (smtpd_milters and non_smtpd_milters in
# chatmail-config/main.cf), so with the packaged default the two never
# connect. With `milter_default_action = tempfail`, every message a
# member sends is then deferred with a 4xx, and Postfix logs the
# refused connection to the container's output.
#
# The socket is bound to loopback inside the container's own network
# namespace, so it is not reachable from outside the container.

Syslog                  yes
SyslogSuccess           yes
LogWhy                  no

# Drop privileges to the user that owns the keys. OpenDKIM's key-security
# check requires the containing directory to be owned by the executing
# uid, and the entrypoint chowns /etc/opendkim to opendkim, so running as
# root means no key can be loaded.
UserID                  opendkim

UMask                   007
# Signing only. Verification is a second instance, opendkim-verify.conf,
# because the sign-or-verify decision is made from the client address
# and every message reaches the re-injection listeners from 127.0.0.1.
Mode                    s
Canonicalization        relaxed/simple

# Must match smtpd_milters and non_smtpd_milters in main.cf.
Socket                  inet:8891@localhost
PidFile                 /run/opendkim/opendkim.pid

OversignHeaders         From
TrustAnchorFile         /usr/share/dns/root.key

# Written by chatmail-config/entrypoint.sh at first boot, from the
# generated key. Both are keyed on the MAIL_DOMAIN the container is
# started with.
KeyTable                /etc/opendkim/KeyTable
SigningTable            refile:/etc/opendkim/SigningTable
InternalHosts           /etc/opendkim/TrustedHosts
ExternalIgnoreList      /etc/opendkim/TrustedHosts
