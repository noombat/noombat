#
# Dovecot configuration for the noombat-chatmail container.
#
# Implements the Chatmail doveauth create-on-login mechanism:
# authentication succeeds for any address@MAIL_DOMAIN with the
# password stored in /home/vmail/{address}/password. If the file
# does not exist, authentication triggers account creation
# (the password file is written, and the maildir is initialised).

protocols = imap lmtp

# ..... AUTHENTICATION .....

# Use a checkpassword-compatible authentication script that reads
# per-user password files at /home/vmail/{user}/password.
#
# Passwords are stored as plaintext. This is consistent with the
# upstream Chatmail (chatmaild/doveauth) design: the credentials
# are server-generated, high-entropy random tokens (192 bits),
# never chosen or reused by humans, so the offline brute-force
# threat that password hashing mitigates does not apply. Filesystem
# permissions (vmail:vmail, mode 0600) are the access-control
# boundary.
#
# This implements the Chatmail doveauth create-on-login mechanism:
# if the password file does not exist, the script creates it (and
# the maildir), enabling automatic account provisioning on first
# login.
#
# The upstream Chatmail deployment uses the `doveauth` daemon for
# this purpose; the helper script below provides equivalent behaviour
# without requiring the Python-based `chatmaild` package.
passdb {
    driver = checkpassword
    args = /usr/local/bin/noombat-doveauth
}

userdb {
    driver = static
    args = uid=5000 gid=5000 home=/home/vmail/%u
}

# Allow plain-text authentication only over TLS.
auth_mechanisms = plain login
disable_plaintext_auth = yes

# ..... MAIL LOCATION .....

mail_location = maildir:/home/vmail/%u/Maildir
mail_uid = 5000
mail_gid = 5000

# ..... SSL/TLS .....

ssl = required
ssl_cert = </etc/ssl/certs/chatmail.pem
ssl_key = </etc/ssl/private/chatmail.key

# ..... IMAP .....

protocol imap {
    mail_max_userip_connections = 20
}

# ..... LMTP .....

# Dovecot LMTP: receives mail from Postfix for local delivery.
protocol lmtp {
    postmaster_address = postmaster@MAIL_DOMAIN
}

service lmtp {
    unix_listener /var/spool/postfix/private/dovecot-lmtp {
        mode = 0600
        user = postfix
        group = postfix
    }
}

# ..... SASL for Postfix .....

# Dovecot provides SASL authentication to Postfix for SMTP
# submission (port 465/587).
service auth {
    unix_listener /var/spool/postfix/private/auth {
        mode = 0660
        user = postfix
        group = postfix
    }
}

# ..... LOGGING .....

log_path = /dev/stderr
info_log_path = /dev/stderr
