#
# Dovecot 2.4 configuration for the noombat-chatmail container.

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap lmtp

# ..... AUTHENTICATION .....

# Accounts are one passwd-file that the admin sidecar keeps, a line per
# address with its password hashed with Argon2id. The sidecar's
# authenticated endpoint is the only thing that adds a line: nothing here
# creates an account, so a login attempt on an unknown address fails.
passdb passwd-file {
    passwd_file_path = /home/vmail/.noombat-admin/passwd
}

# Where an account's mail lives. Before delivering, Dovecot confirms the
# recipient exists by a lookup in the passdb above, so mail for an
# address with no line is refused rather than stored.
userdb static {
    fields {
        uid = vmail
        gid = vmail
        home = /home/vmail/%{user}
    }
}

# Plain-text mechanisms, and only over TLS.
auth_mechanisms = plain login
auth_allow_cleartext = no

# ..... MAIL LOCATION .....

mail_driver = maildir
mail_path = %{home}/Maildir
mail_uid = vmail
mail_gid = vmail

namespace inbox {
    inbox = yes
}

# ..... SSL/TLS .....

ssl = required
ssl_server_cert_file = /etc/ssl/certs/chatmail.pem
ssl_server_key_file = /etc/ssl/private/chatmail.key

# ..... IMAP .....

protocol imap {
    mail_max_userip_connections = 20
}

# ..... LMTP .....

# Dovecot LMTP: receives mail from Postfix for local delivery.
protocol lmtp {
    postmaster_address = postmaster@MAIL_DOMAIN
}

service lmtp {
    unix_listener /var/spool/postfix/private/dovecot-lmtp {
        mode = 0600
        user = postfix
        group = postfix
    }
}

# ..... SASL for Postfix .....

# Dovecot provides SASL authentication to Postfix for SMTP
# submission (port 465/587).
service auth {
    # The passwd-file is root's and readable by the vmail group only, so
    # the process reading it runs as vmail.
    user = vmail

    unix_listener /var/spool/postfix/private/auth {
        mode = 0660
        user = postfix
        group = postfix
    }
}

# ..... LOGGING .....

log_path = /dev/stderr
info_log_path = /dev/stderr
