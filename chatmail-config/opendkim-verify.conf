#
# The verifying half of DKIM, as a second OpenDKIM instance.
#
# One instance cannot do both jobs here. It decides whether to sign or
# to verify from the connecting client's address, and every message
# reaches the re-injection listeners from 127.0.0.1, because the filter
# is what connects. A single instance therefore treats everything as
# internal, signs what its SigningTable matches, and verifies nothing at
# all.
#
# Postfix takes smtpd_milters per service, so the incoming re-injection
# listener points at this instance and the outgoing one at the signer.
# The direction is decided by which listener the message arrived on,
# which the filter already knows, rather than by an address that is the
# same either way.
#
# Verifying is the only thing authenticating a peer. The sender-domain
# allowlist is checked against MAIL FROM, which is unauthenticated, so
# without this anyone able to reach port 25 can claim to be a peer.

Syslog                  yes
SyslogSuccess           yes
LogWhy                  no

UserID                  opendkim
UMask                   007
PidFile                 /run/opendkim/opendkim-verify.pid
Socket                  inet:8892@localhost

# Verify only. No KeyTable and no SigningTable: this instance holds no
# key and must never sign anything.
Mode                    v

Canonicalization        relaxed/simple
TrustAnchorFile         /usr/share/dns/root.key

# Nothing is internal. Left unset, OpenDKIM treats the loopback address
# as internal, which is every connection this instance will ever see,
# and it would verify nothing. The file names a TEST-NET address that
# cannot appear on any network.
InternalHosts           /etc/opendkim/NoInternalHosts

# ..... POLICY .....
#
# Every one of these defaults to `accept`, which means an unconfigured
# OpenDKIM verifies a signature, records the failure, and delivers the
# message anyway. Verification that does not change the outcome is
# verification nobody is doing.

# A signature that does not validate is a forgery or a corruption, and
# neither should be delivered.
On-BadSignature         reject

# Unsigned mail. Every Chatmail relay signs, so an unsigned message
# from a peer is the shape a spoofed peer takes, and the sender-domain
# allowlist cannot tell the difference because it reads MAIL FROM.
#
# This is the setting most likely to refuse mail an operator wanted: it
# is a permanent 5xx, so a peer that stops signing gets a bounce rather
# than a retry. Right for a closed federation of Chatmail relays, wrong
# the moment this instance federates with something that is not one.
# `tempfail` is the softer setting worth reaching for first.
# docs/deployment.md carries the whole trade-off and how to diagnose it.
On-NoSignature          reject

# The signature names a key the DNS does not carry. Usually publishing
# lag rather than an attack, so the sender is asked to try again instead
# of being told never to come back.
On-KeyNotFound          tempfail

# Explicit though both already default this way: a resolver failure
# must never be the reason mail is refused permanently.
On-DNSError             tempfail
On-InternalError        tempfail
