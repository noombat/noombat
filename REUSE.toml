# REUSE 3.3 compliance configuration.
#
# This file declares licensing for files that cannot carry inline SPDX
# headers (configuration, data, and documentation files). All source
# code files (.rs, .ts, .sh, .html, .typ, Dockerfile) carry inline headers.
#
# Verify compliance:    reuse lint
# Add header to a file: reuse annotate --license AGPL-3.0-or-later \
#                          --copyright "Gabriel Henrique Lopes Gomes Alves Nunes" \
#                          --year 2026 <file>
#
# See https://reuse.software/ for the full specification.

version = 1
SPDX-PackageName = "Noombat"
SPDX-PackageDownloadLocation = "https://github.com/noombat/noombat"

[[annotations]]
path = [
    # Cargo manifests and Rust tooling.
    "Cargo.toml",
    "Cargo.lock",
    "crates/*/Cargo.toml",
    "rust-toolchain.toml",
    "rustfmt.toml",
    "deny.toml",
    # Configuration.
    "noombat.toml",
    ".env.example",
    ".env.test",
    ".gitignore",
    ".dockerignore",
    ".nvmrc",
    ".prettierrc.json",
    ".prettierignore",
    # Database migrations.
    "migrations/**",
    # Typst CV templates.
    "templates/**",
    # Locale files.
    "crates/noombat-api/locales/**",
    # Frontend metadata and generated bindings.
    "frontend/package.json",
    "frontend/tsconfig.json",
    "frontend/pnpm-lock.yaml",
    "frontend/**/*.d.ts",
    # Test metadata.
    "tests/e2e/package.json",
    "tests/e2e/tsconfig.json",
    "tests/e2e/pnpm-lock.yaml",
    # Documentation (all Markdown files).
    "**/*.md",
    "docs/**",
    # CI workflow and templates.
    ".github/**",
]
SPDX-License-Identifier = "AGPL-3.0-or-later"
SPDX-FileCopyrightText = "2026 Gabriel Henrique Lopes Gomes Alves Nunes"

# Third-party font, not our copyright and not under the project licence.
#
# STIX Two Math is vendored rather than pulled from npm because every
# packaged build of it is subset. `@fontsource/stix-two-math` 5.3.0
# declares `unicode-range: U+0000-00FF, ...`, i.e. Latin only, which
# leaves Greek, the operators and the U+1D400 mathematical alphanumerics
# to the system font: exactly the glyphs Android has no MATH font for,
# and the only reason to ship a font at all. This is the unsubset
# release, converted from the Google Fonts TTF to WOFF2. Converting drops
# the DSIG table, which WOFF2 invalidates by design; the MATH table that
# makes it a maths font is preserved.
[[annotations]]
path = ["frontend/src/fonts/STIXTwoMath-Regular.woff2"]
SPDX-License-Identifier = "OFL-1.1"
SPDX-FileCopyrightText = "2001-2021 The STIX Fonts Project Authors (https://github.com/stipub/stixfonts), with Reserved Font Name \"TM Math\""
